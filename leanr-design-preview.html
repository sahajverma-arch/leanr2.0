<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leanr — Design Preview</title>
<style>
  :root { --bg: #0b0b0b; --panel: #151515; --line: #2a2a2a; --text: #f2f2f2; --muted: #a8a8a8; --brand: #FDEC06; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
  .app { display: flex; height: 100%; }
  .side { width: 260px; flex: none; border-right: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px 14px; box-sizing: border-box; }
  .side h1 { font-size: 16px; margin: 0 0 4px; color: var(--brand); letter-spacing: .5px; }
  .side p { margin: 0 0 14px; font-size: 12px; color: var(--muted); line-height: 1.4; }
  .side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin: 18px 0 6px; }
  .side button { display: block; width: 100%; text-align: left; background: none; border: 0; color: var(--text); font: inherit; font-size: 13px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
  .side button:hover { background: #222; }
  .side button[aria-current="true"] { background: var(--brand); color: #000; font-weight: 700; }
  .main { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 16px; box-sizing: border-box; }
  .phone { width: 390px; height: 844px; border-radius: 44px; border: 10px solid #1d1d1d; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px #333; overflow: hidden; background: #000; transform-origin: center; flex: none; }
  .scroller { width: 390px; height: 844px; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
  .scroller::-webkit-scrollbar { display: none; }
  .err { padding: 24px; color: #ff8a80; font-family: monospace; white-space: pre-wrap; }
  @media (max-width: 760px) { .side { display: none; } }
</style>
</head>
<body>
<div class="app">
  <nav class="side" aria-label="Screens">
    <h1>LEANR · DESIGN PREVIEW</h1>
    <p>Local copy of the canvas. Click buttons and tabs inside the phone to move between screens.</p>

    <div id="list"></div>
  </nav>
  <main class="main"><div class="phone" id="phone"><div class="scroller" id="scroller"><div id="stage"></div></div></div></main>
</div>
<script>
const SCREENS = {"AIChat":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — AI chat\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700\u0026amp;family=Manrope:wght@400;500;600;700;800\u0026amp;display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody{margin:0;background:#050505}\na{color:#FDEC06}a:hover{color:#FFF56B}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.orb{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none}\n.glass{background:linear-gradient(150deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 12px 32px rgba(0,0,0,0.35)}\n.glass-y{background:linear-gradient(150deg,rgba(253,236,6,0.26),rgba(253,236,6,0.07));border:1px solid rgba(253,236,6,0.42);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.16),0 12px 32px rgba(0,0,0,0.35)}\n.cta{background:#FDEC06;color:#000000;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 10px 30px rgba(253,236,6,0.30)}\n.dotty{animation:dotty 1.2s ease-in-out infinite}\n@keyframes dotty{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}\n.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}\ninput::placeholder{color:rgba(255,255,255,0.5)}\ninput:focus{outline:none}\nbutton:disabled{cursor:default}\n\u003c/style\u003e\n\u003c/helmet\u003e\n\u003cdiv style=\"width: 390px; height: 844px; box-sizing: ze: 12px; color: rgba(255, 255, 255, 0.72)\"\u003e{{ status }}\u003c/span\u003e\n    \u003c/div\u003e\n    \u003ca href=\"ChatIntro.dc.html\" class=\"glass\" aria-label=\"Rename or set up your coach\" style=\"width: 40px; height: 40px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none\"\u003e\n      \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 20px; height: 20px\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"3\"/\u003e\u003cpath d=\"M12 2.8v2.4M12 18.8v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.8 12h2.4M18.8 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7\"/\u003e\u003c/svg\u003e\n    \u003c/a\u003e\n  \u003c/header\u003e\n\n  \u003csection class=\"scroll\" aria-label=\"Conversation\" aria-live=\"polite\" style=\"position: absolute; left: 0; right: 0; top: 122px; bottom: 164px; overflow-y: auto; padding: 8px 16px 10px; box-sizing: border-box; display: flex; flex-direction: column-reverse; gap: 12px\"\u003e\n    \u003csc-for list=\"{{ items }}\" as=\"m\" hint-placeholder-count=\"5\"\u003e\n      \u003csc-if value=\"{{ m.isUser }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n        \u003cdiv style=\"align-self: flex-end; max-width: 78%; padding: 10px 14px; border-radius: 18px 18px 4px 18px; background: #FDEC06; color: #000000; font-size: 14px; font-weight: 700; line-height: 1.4\"\u003e{{ m.text }}\u003c/div\u003e\n      \u003c/sc-if\u003e\n      \u003csc-if value=\"{{ m.isTyping }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n        \u003cdiv style=\"display: flex; align-items: flex-end; gap: 8px\"\u003e\n          \u003cspan class=\"cta\" aria-hidden=\"true\" style=\"width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 13px; flex: none\"\u003e{{ initial }}\u003c/span\u003e\n          \u003cdiv class=\"glass\" aria-label=\"{{ typingLabel }}\" style=\"padding: 12px 14px; border-radius: 18px 18px 18px 4px; display: flex; gap: 5px\"\u003e\n            \u003cspan class=\"dotty\" style=\"width: 7px; height: 7px; border-radius: 999px; background: #FFFFFF\"\u003e\u003c/span\u003e\n            \u003cspan class=\"dotty\" style=\"width: 7px; height: 7px; border-radius: 999px; background: #FFFFFF; animation-delay: .15s\"\u003e\u003c/span\u003e\n            \u003cspan class=\"dotty\" style=\"width: 7px; height: 7px; border-radius: 999px; background: #FFFFFF; animation-delay: .3s\"\u003e\u003c/span\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/sc-if\u003e\n      \u003csc-if value=\"{{ m.isBot }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n        \u003cdiv style=\"display: flex; align-items: flex-end; gap: 8px; max-width: 90%\"\u003e\n          \u003cspan class=\"cta\" aria-hidden=\"true\" style=\"width: 28px; height: 28px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 13px; flex: none\"\u003e{{ initial }}\u003c/span\u003e\n          \u003cdiv class=\"glass\" style=\"flex: 1; min-width: 0; padding: 10px 14px; border-radius: 18px 18px 18px 4px; display: flex; flex-direction: column; gap: 10px\"\u003e\n            \u003cspan style=\"font-size: 14px; line-height: 1.45\"\u003e{{ m.text }}\u003c/span\u003e\n\n            \u003csc-if value=\"{{ m.hasMeal }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n              \u003cdiv class=\"glass-y\" style=\"border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px\"\u003e\n                \u003cspan style=\"font-size: 10px; font-weight: 800; letter-spacing: 1.1px; text-transform: uppercase; color: #FDEC06\"\u003e{{ m.mealTag }}\u003c/span\u003e\n                \u003cspan style=\"font-size: 15px; font-weight: 800\"\u003e{{ m.mealTitle }}\u003c/span\u003e\n u003c/svg\u003e\n                  \u003cspan style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: \u0027Chakra Petch\u0027, sans-serif; font-weight: 700; font-size: 15px\"\u003e86\u003c/span\u003e\n                \u003c/span\u003e\n                \u003cspan style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"\u003e\n                  \u003cspan style=\"font-size: 13px; font-weight: 800\"\u003eKnees caved in on 3 squats\u003c/span\u003e\n                  \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.8)\"\u003ePush them out over your toes on the way down.\u003c/span\u003e\n                  \u003cspan style=\"font-size: 12px; font-weight: 800; color: #FDEC06\"\u003eOpen score card →\u003c/span\u003e\n                \u003c/span\u003e\n              \u003c/a\u003e\n            \u003c/sc-if\u003e\n\n            \u003csc-if value=\"{{ m.hasOptions }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n              \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\"\u003e\n                \u003csc-for list=\"{{ m.options }}\" as=\"o\" hint-placeholder-count=\"2\"\u003e\n                  \u003cbutton class=\"{{ o.cls }}\" aria-pressed=\"{{ o.on }}\" disabled=\"{{ o.disabled }}\" onClick=\"{{ o.pick }}\" style=\"border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: {{ o.fg }}; text-align: left; font-family: \u0027Manrope\u0027, sans-serif; cursor: pointer; opacity: {{ o.opacity }}\"\u003e\n                    \u003cspan style=\"display: flex; flex-direction: column; gap: 1px\"\u003e\n                      \u003cspan style=\"font-size: 13px; font-weight: 800\"\u003e{{ o.label }}\u003c/span\u003e\n                      \u003cspan style=\"font-size: 11px; font-weight: 600; opacity: 0.8\"\u003e{{ o.sub }}\u003c/span\u003e\n                    \u003c/span\u003e\n                    \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 16px; height: 16px\"\u003e\u003cpath d=\"m9 5 7 7-7 7\"/\u003e\u003c/svg\u003e\n                  \u003c/button\u003e\n                \u003c/sc-for\u003e\n              \u003c/div\u003e\n            \u003c/sc-if\u003e\n\n            \u003csc-if value=\"{{ m.hasLinks }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n              \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\"\u003e\n                \u003csc-for list=\"{{ m.links }}\" as=\"l\" hint-placeholder-count=\"2\"\u003e\n                  \u003ca href=\"{{ l.href }}\" class=\"glass\" style=\"border-radius: 12px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; color: #FFFFFF; text-decoration: none\"\u003e\n                    \u003cspan style=\"display: flex; flex-direction: column; gap: 1px\"\u003e\n                      \u003cspan style=\"font-size: 13px; font-weight: 800\"\u003e{{ l.label }}\u003c/span\u003e\n                      \u003cspan style=\"font-size: 11px; color: rgba(255, 255, 255, 0.75)\"\u003e{{ l.sub }}\u003c/span\u003e\n                    \u003c/span\u003e\n                    \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 16px; height: 16px; color: #FDEC06\"\u003e\u003cpath d=\"m9 5 7 7-7 7\"/\u003e\u003c/svg\u003e\n                  \u003c/a\u003e\n                \u003c/sc-for\u003e\n              \u003c/div\u003e\n            \u003c/sc-if\u003e\n          \u003c/div\u003e\n        \u003c/div\u003e\n      \u003c/sc-if\u003e\n    \u003c/sc-for\u003e\n    \u003cdiv style=\"align-self: center; font-size: 11px; font-weight: 700; color: rgba(255, 255, 255, 0.55); padding: 4px 0 2px\"\u003eToday · {{ name }} can make mistakes — check important advice with your coach\u003c/div\u003e\n  \u003c/section\u003e\n\n  \u003cdiv style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 0 0 26px; display: flex; flex-direction: column; gap: 10px; z-index: 2\"\u003e\n    \u003cdiv role=\"group\" aria-label=\"Suggestions\" class=\"scroll\" style=\"display: flex; gap: 8px; overflow-x: auto; padding: 0 16px\"\u003e\n      \u003csc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"4\"\u003e\n        \u003cbutton class=\"glass\" onClick=\"{{ c.send }}\" disabled=\"{{ busy }}\" style=\"flex: none; height: 36px; padding: 0 14px; border-radius: 999px; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 700; font-size: 13px; white-space: nowrap; cursor: pointer; background: rgba(18, 18, 18, 0.55)\"\u003e{{ c.label }}\u003c/button\u003e\n      \u003c/sc-for\u003e\n    \u003c/div\u003e\n    \u003cdiv class=\"glass\" style=\"margin: 0 12px; border-radius: 26px; padding: 6px; display: flex; align-items: center; gap: 6px; background: rgba(18, 18, 18, 0.6)\"\u003e\n      \u003cbutton class=\"glass\" aria-label=\"Snap a meal photo to log it\" onClick=\"{{ photo }}\" style=\"width: 42px; height: 42px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: none\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 20px; height: 20px\"\u003e\u003cpath d=\"M4 8h3l2-3h6l2 3h3v11H4Z\"/\u003e\u003ccircle cx=\"12\" cy=\"13\" r=\"3.5\"/\u003e\u003c/svg\u003e\n      \u003c/button\u003e\n      \u003clabel style=\"flex: 1; min-width: 0; display: flex\"\u003e\n        \u003cspan style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap\"\u003eMessage your coach\u003c/span\u003e\n        \u003cinput type=\"text\" placeholder=\"{{ placeholder }}\" value=\"{{ draft }}\" onChange=\"{{ onDraft }}\" onKeyDown=\"{{ onKey }}\" style=\"flex: 1; min-width: 0; height: 42px; background: transparent; border: 0; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; font-size: 15px; padding: 0 6px\"\u003e\n      \u003c/label\u003e\n      \u003cbutton class=\"glass\" aria-label=\"Speak your message\" style=\"width: 42px; height: 42px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: none\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 20px; height: 20px\"\u003e\u003crect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/\u003e\u003cpath d=\"M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21\"/\u003e\u003c/svg\u003e\n      \u003c/button\u003e\n      \u003cbutton class=\"cta\" aria-label=\"Send message\" onClick=\"{{ sendDraft }}\" style=\"width: 42px; height: 42px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: none\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 20px; height: 20px; stroke-width: 2.2\"\u003e\u003cpath d=\"M4 12 20 4l-6 16-3-7Z\"/\u003e\u003cpath d=\"m11 13 9-9\"/\u003e\u003c/svg\u003e\n      \u003c/button\u003e\n    \u003c/div\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"botName\":{\"editor\":\"text\",\"default\":\"Kai\"},\"$preview\":{\"width\":390,\"height\":844}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.nextId = 10;\n    this.state = {\n      draft: \u0027\u0027,\n      typing: false,\n      mode: null,\n      msgs: [\n        { id: 1, from: \u0027bot\u0027, text: \"Morning Aarav! Day 2 of your Pro plan, and PT with Rhea at 6 PM. What can I help with?\" },\n        { id: 2, from: \u0027user\u0027, text: \u0027What should I eat after my workout tonight?\u0027 },\n        { id: 3, from: \u0027bot\u0027, text: \"After strength training, go for protein plus carbs within an hour. This one\u0027s already in your plan:\", meal: { tag: \u0027From your plan\u0027, title: \u0027Paneer tikka wrap\u0027, meta: \u0027480 kcal · 32 g protein · 10 min to make\u0027, actions: true } },\n        { id: 4, from: \u0027user\u0027, text: \u0027How was my squat form yesterday?\u0027 },\n        { id: 5, from: \u0027bot\u0027, text: \u0027Solid session — Inferno Full Body scored 86, up 6 on last time. One thing to fix:\u0027, score: true }\n      ]\n    };\n  }\n  componentWillUnmount() { clearTimeout(this.t); }\n  add(msg) { this.nextId += 1; return this.state.msgs.concat([Object.assign({ id: this.nextId }, msg)]); }\n  botReply(msg, extra) {\n    this.setState({ typing: true });\n    clearTimeout(this.t);\n    this.t = setTimeout(() =\u003e { this.setState(Object.assign({ typing: false, msgs: this.add(Object.assign({ from: \u0027bot\u0027 }, msg)) }, extra || {})); }, 900);\n  }\n  user(text) { this.setState({ msgs: this.add({ from: \u0027user\u0027, text }), draft: \u0027\u0027 }); }\n  intent(key, label) {\n    if (this.state.typing) return;\n    this.user(label);\n    this.botReply(this.replyFor(key), { mode: key === \u0027log\u0027 ? \u0027log\u0027 : null });\n  }\n  replyFor(key) {\n    const R = {\n      swap: { text: \u0027Here are two swaps with the same calories as tonight\\\u0027s dinner (420 kcal):\u0027, options: [\n        { label: \u0027Grilled fish + millet roti\u0027, sub: \u0027420 kcal · 38 g protein\u0027, reply: \"Done — tonight\u0027s dinner is now grilled fish with millet roti. Your macros still add up.\" },\n        { label: \u0027Tofu stir-fry + brown rice\u0027, sub: \u0027415 kcal · 26 g protein · vegan\u0027, reply: \"Done — tonight\u0027s dinner is now tofu stir-fry with brown rice.\" }] },\n      log: { text: \u0027Tell me what you ate — like \"2 rotis, dal and salad\" — or tap the camera to snap your plate.\u0027 },\n      plan: { text: \u0027Tomorrow, give your legs a break. Two good options:\u0027, links: [\n        { label: \u0027Push Blitz · 16 min AI session\u0027, sub: \u0027Push-ups, pike push-ups, dips, shoulder taps\u0027, href: \u0027AISession.dc.html\u0027 },\n        { label: \u0027Full-body Strength · live 7:30 PM\u0027, sub: \u0027Kabir Khan · 40 min\u0027, href: \u0027Live.dc.html\u0027 }] },\n      book: { text: \u0027Rhea has free slots tomorrow, Tue 20 Oct. Which one works?\u0027, options: [\n        { label: \u00276:00 AM\u0027, sub: \u002760 min · ₹810 Pro price\u0027, reply: \u0027Booked! Tue 20 Oct, 6:00 AM with Rhea — ₹810 (Pro price). I\\\u0027ll remind you an hour before.\u0027 },\n        { label: \u00278:00 AM\u0027, sub: \u002760 min · ₹810 Pro price\u0027, reply: \u0027Booked! Tue 20 Oct, 8:00 AM with Rhea — ₹810 (Pro price). I\\\u0027ll remind you an hour before.\u0027 },\n        { label: \u00276:00 PM\u0027, sub: \u002760 min · ₹810 Pro price\u0027, reply: \u0027Booked! Tue 20 Oct, 6:00 PM with Rhea — ₹810 (Pro price). I\\\u0027ll remind you an hour before.\u0027 }] },\n      motivate: { text: \"You\u0027ve trained 3 times this week and your form score is up 6. Two more days like this and it\u0027s your best streak yet. Let\u0027s go, Aarav!\" }\n    };\n    return R[key];\n  }\n  pickOption(msgId, idx) {\n    if (this.state.typing) return;\n    const msgs = this.state.msgs.map((m) =\u003e (m.id === msgId ? Object.assign({}, m, { chosen: idx }) : m));\n    const m = this.state.msgs.find((x) =\u003e x.id === msgId);\n    const o = m.options[idx];\n    this.nextId += 1;\n    this.setState({ msgs: msgs.concat([{ id: this.nextId, from: \u0027user\u0027, text: o.label }]) });\n    this.botReply({ text: o.reply });\n  }\n  sendText(text) {\n    const t = String(text || \u0027\u0027).trim();\n    if (!t || this.state.typing) return;\n    const wasLog = this.state.mode === \u0027log\u0027;\n    this.user(t);\n    if (wasLog || /\\b(ate|had|roti|rice|dal|eggs?|breakfast|lunch|dinner|snack)\\b/i.test(t)) {\n      this.botReply({ text: \u0027Logged it. Here\\\u0027s my estimate:\u0027, meal: { tag: \u0027Logged · today\u0027, title: t.charAt(0).toUpperCase() + t.slice(1), meta: \u0027≈ 410 kcal · 18 g protein · estimate\u0027, actions: false } }, { mode: null });\n    } else {\n      this.botReply({ text: \u0027Got it — I\\\u0027ll keep that in mind for your plan. Want me to swap a meal, plan a workout or book a session?\u0027 }, { mode: null });\n    }\n  }\n  name() { const n = String(this.props.botName || \u0027\u0027).trim(); return n || \u0027Kai\u0027; }\n  renderVals() {\n    const s = this.state;\n    const name = this.name();\n    const items = s.msgs.map((m) =\u003e {\n      const isBot = m.from === \u0027bot\u0027;\n      const locked = m.locked === true;\n      const it = {\n        isUser: !isBot, isBot, isTyping: false, text: m.text,\n        hasMeal: !!m.meal, hasScore: !!m.score, hasOptions: !!m.options, hasLinks: !!m.links,\n        mealTag: m.meal ? m.meal.tag : \u0027\u0027, mealTitle: m.meal ? m.meal.title : \u0027\u0027, mealMeta: m.meal ? m.meal.meta : \u0027\u0027,\n        mealActions: !!(m.meal \u0026\u0026 m.meal.actions), locked, lockOpacity: locked ? \u00270.5\u0027 : \u00271\u0027,\n        addMeal: () =\u003e {\n          if (s.typing) return;\n          const msgs = s.msgs.map((x) =\u003e (x.id === m.id ? Object.assign({}, x, { locked: true }) : x));\n          this.nextId += 1;\n          this.setState({ msgs: msgs.concat([{ id: this.nextId, from: \u0027user\u0027, text: \u0027Add it to today\u0027 }]) });\n          this.botReply({ text: \u0027Added paneer tikka wrap to tonight at 7:15 PM. You\\\u0027ll still be about 90 kcal under your target.\u0027 });\n        },\n        swapMeal: () =\u003e {\n          if (s.typing) return;\n          const msgs = s.msgs.map((x) =\u003e (x.id === m.id ? Object.assign({}, x, { locked: true }) : x));\n          this.nextId += 1;\n          this.setState({ msgs: msgs.concat([{ id: this.nextId, from: \u0027user\u0027, text: \u0027Swap it for something else\u0027 }]) });\n          this.botReply(this.replyFor(\u0027swap\u0027));\n        },\n        options: (m.options || []).map((o, i) =\u003e {\n          const chosen = m.chosen === i, done = m.chosen != null;\n          return { label: o.label, sub: o.sub, on: chosen, disabled: done, cls: chosen ? \u0027cta\u0027 : \u0027glass\u0027, fg: chosen ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027, opacity: done \u0026\u0026 !chosen ? \u00270.5\u0027 : \u00271\u0027, pick: () =\u003e this.pickOption(m.id, i) };\n        }),\n        links: m.links || []\n      };\n      return it;\n    });\n    if (s.typing) items.push({ isUser: false, isBot: false, isTyping: true });\n    const chips = [[\u0027swap\u0027, \u0027Swap my dinner\u0027], [\u0027log\u0027, \u0027Log a meal\u0027], [\u0027plan\u0027, \"Plan tomorrow\u0027s workout\"], [\u0027book\u0027, \u0027Book PT with Rhea\u0027], [\u0027motivate\u0027, \u0027Motivate me\u0027]]\n      .map(([k, label]) =\u003e ({ label, send: () =\u003e this.intent(k, label) }));\n    return {\n      name,\n      initial: name.charAt(0).toUpperCase(),\n      status: s.typing ? \u0027Typing…\u0027 : \u0027Online · knows your plan\u0027,\n      typingLabel: name + \u0027 is typing\u0027,\n      items: items.reverse(),\n      chips,\n      busy: s.typing,\n      draft: s.draft,\n      placeholder: s.mode === \u0027log\u0027 ? \u0027e.g. 2 rotis, dal and salad\u0027 : \u0027Message \u0027 + name + \u0027…\u0027,\n      onDraft: (e) =\u003e this.setState({ draft: e.target.value }),\n      onKey: (e) =\u003e { if (e.key === \u0027Enter\u0027) this.sendText(this.state.draft); },\n      sendDraft: () =\u003e this.sendText(this.state.draft),\n      photo: () =\u003e {\n        if (s.typing) return;\n        this.user(\u0027[Photo of my lunch]\u0027);\n        this.botReply({ text: \u0027Nice plate! Here\\\u0027s what I see:\u0027, meal: { tag: \u0027Logged from photo\u0027, title: \u0027Rajma, rice and cucumber salad\u0027, meta: \u0027≈ 540 kcal · 19 g protein · estimate\u0027, actions: false } });\n      }\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","AICoach":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — AI Coach\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700\u0026amp;family=Manrope:wght@400;500;600;700;800\u0026amp;display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody{margin:0;background:#050505}\na{color:#FDEC06}a:hover{color:#FFF56B}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.orb{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none}\n.glass{background:linear-gradient(150deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 12px 32px rgba(0,0,0,0.35)}\n.glass-y{background:linear-gradient(150deg,rgba(253,236,6,0.26),rgba(253,236,6,0.07));border:1px solid rgba(253,236,6,0.42);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.16),0 12px 32px rgba(0,0,0,0.35)}\n.cta{background:#FDEC06;color:#000000;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 10px 30px rgba(253,236,6,0.30)}\n.pulse{animation:pulse 1.6s ease-in-out infinite}\n@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}\n\u003c/style\u003e\n\u003c/helmet\u003e\n\u003cdiv style=\"width: 390px; height: 1220px; box-sizing: border-box; background: #050505; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; position: relative; overflow: hidden\"\u003e\n  \u003cdiv class=\"orb\" aria-hidden=\"true\" style=\"width: 340px; height: 340px; right: -140px; top: -90px; background: #FDEC06; opacity: 0.32\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"orb\" aria-hidden=\"true\" style=\"width: 300px; height: 300px; left: -160px; top: 380px; background: #FF8A00; opacity: 0.22\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"orb\" aria-hidden=\"true\" style=\"width: 300px; height: 300px; right: -140px; top: 820px; background: #FDEC06; opacity: 0.18\"\u003e\u003c/div\u003e\n\n  \u003cmain style=\"position: relative; padding: 52px 20px 124px; display: flex; flex-direction: column; gap: 16px\"\u003e\n    \u003cheader style=\"display: flex; align-items: flex-start; justify-content: space-between; gap: 12px\"\u003e\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\"\u003e\n        \u003cspan style=\"display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; letter-spacing: 1.2px; color: #FDEC06\"\u003e\u003cspan class=\"pulse\" style=\"width: 7px; height: 7px; border-radius: 999px; background: #FDEC06; box-shadow: 0 0 8px #FDEC06\"\u003e\u003c/span\u003eAI-POWERED\u003c/span\u003e\n        \u003ch1 style=\"margin: 0; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase\"\u003eAI Coach\u003c/h1\u003e\n        \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.45; color: rgba(255, 255, 255, 0.72)\"\u003eTrain in front of your camera. AI counts every rep and fixes your form as you go.\u003c/p\u003e\n      \u003c/div\u003e\n      \u003cbutton class=\"glass\" aria-label=\"How AI Coach works\" style=\"width: 44px; height: 44px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; flex: none\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"8.5\"/\u003e\u003cpath d=\"M9.6 9.5a2.5 2.5 0 1 1 3.3 2.4c-.6.2-.9.7-.9 1.3v.6M12 16.6v.2\"/\u yle=\"font-size: 10px; font-weight: 800; letter-spacing: 1px; color: rgba(255, 255, 255, 0.72)\"\u003eDEPTH\u003c/span\u003e\n    \u003cdiv class=\"glass\" style=\"position: relative; width: 14px; height: 230px; border-radius: 999px; background: rgba(18, 18, 18, 0.5); overflow: hidden\"\u003e\n      \u003cdiv style=\"position: absolute; left: 0; right: 0; bottom: 0; height: {{ depth }}; background: {{ depthColor }}; border-radius: 999px; transition: height .4s\"\u003e\u003c/div\u003e\n      \u003cdiv style=\"position: absolute; left: -2px; right: -2px; bottom: 82%; height: 2px; background: #FFFFFF\"\u003e\u003c/div\u003e\n    \u003c/div\u003e\n    \u003cspan style=\"font-size: 10px; font-weight: 800; color: rgba(255, 255, 255, 0.72)\"\u003eTARGET\u003c/span\u003e\n  \u003c/div\u003e\n\n  \u003cdiv role=\"status\" aria-live=\"polite\" style=\"position: absolute; left: 20px; right: 20px; top: 632px; box-sizing: border-box; border-radius: 18px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; background: {{ cueBg }}; border: 1.5px solid {{ cueBorder }}; -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px)\"\u003e\n    \u003cdiv style=\"width: 34px; height: 34px; border-radius: 999px; background: {{ cueIconBg }}; color: #000000; display: flex; align-items: center; justify-content: center; flex: none\"\u003e\n      \u003csc-if value=\"{{ bad }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px; stroke-width: 2.6\"\u003e\u003cpath d=\"M12 7v6M12 17v.5\"/\u003e\u003c/svg\u003e\n      \u003c/sc-if\u003e\n      \u003csc-if value=\"{{ good }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px; stroke-width: 2.6\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7\"/\u003e\u003c/svg\u003e\n      \u003c/sc-if\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; gap: 1px\"\u003e\n      \u003cspan style=\"font-size: 16px; font-weight: 800\"\u003e{{ cue }}\u003c/span\u003e\n      \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.78)\"\u003e{{ cueSub }}\u003c/span\u003e\n    \u003c/div\u003e\n    \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-label=\"Voice coach on\" role=\"img\" style=\"width: 20px; height: 20px; color: rgba(255, 255, 255, 0.72)\"\u003e\u003cpath d=\"M4 9.5h3.5L12 5.5v13l-4.5-4H4Z\"/\u003e\u003cpath d=\"M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11\"/\u003e\u003c/svg\u003e\n  \u003c/div\u003e\n\n  \u003cdiv style=\"position: absolute; left: 20px; right: 20px; bottom: 28px; display: flex; align-items: stretch; gap: 10px\"\u003e\n    \u003cdiv class=\"glass\" style=\"flex: 1; border-radius: 22px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; background: rgba(18, 18, 18, 0.5)\"\u003e\n      \u003cdiv aria-live=\"polite\" style=\"display: flex; align-items: baseline\"\u003e\n        \u003cspan style=\"font-family: \u0027Chakra Petch\u0027, sans-serif; font-weight: 700; font-size: 52px; line-height: 1\"\u003e{{ rep }}\u003c/span\u003e\n        \u003cspan style=\"font-family: \u0027Chakra Petch\u0027, sans-serif; font-weight: 700; font-size: 22px; color: rgba(255, 255, 255, 0.6)\"\u003e/12\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 2px\"\u003e\n        \u003cspan style=\"font-size: 11px; font-weight: 800; letter-spacing: 1px; color: #FDEC06\"\u003eREPS\u003c/span\u003e\n        \u003cspan style=\"font-size: 13px; font-weight: 700\"\u003e{{ setLabel }}\u003c/span\u003e\n        \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.72)\"\u003e{{ cleanLabel }}\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\"\u003e\n      \u003cbutton class=\"{{ pauseCls }}\" aria-label=\"{{ pauseAria }}\" onClick=\"{{ togglePause }}\" style=\"width: 52px; height: 42px; border-radius: 14px; color: {{ pauseFg }}; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer\"\u003e\n        \u003csc-if value=\"{{ paused }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"M7 5v14l11-7Z\"/\u003e\u003c/svg\u003e\n        \u003c/sc-if\u003e\n        \u003csc-if value=\"{{ running }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px; stroke-width: 2.4\"\u003e\u003cpath d=\"M9 5v14M15 5v14\"/\u003e\u003c/svg\u003e\n        \u003c/sc-if\u003e\n      \u003c/button\u003e\n      \u003ca href=\"AIRest.dc.html\" class=\"glass\" aria-label=\"Skip to rest\" style=\"width: 52px; height: 42px; box-sizing: border-box; border-radius: 14px; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"m6 6 7 6-7 6V6ZM16 6v12\"/\u003e\u003c/svg\u003e\n      \u003c/a\u003e\n    \u003c/div\u003e\n    \u003ca href=\"AIScore.dc.html\" class=\"cta\" style=\"width: 72px; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: #000000; text-decoration: none; font-weight: 800; font-size: 12px\"\u003e\n      \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 20px; height: 20px; stroke-width: 2.2\"\u003e\u003crect x=\"6\" y=\"6\" width=\"12\" height=\"12\" rx=\"2\"/\u003e\u003c/svg\u003eFinish\u003c/a\u003e\n  \u003c/div\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":844}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { rep: 7, set: 2, phase: \u0027down\u0027, bad: true, paused: false, sec: 462, score: 92, clean: 18 };\n  }\n  componentDidMount() {\n    this.timer = setInterval(() =\u003e this.tick(), 1000);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n  }\n  tick() {\n    const s = this.state;\n    if (s.paused) return;\n    if (s.phase === \u0027down\u0027) {\n      let rep = s.rep + 1, set = s.set;\n      const clean = s.clean + (s.bad ? 0 : 1);\n      if (rep \u003e 12) { rep = 1; set = set \u003e= 3 ? 1 : set + 1; }\n      this.setState({ sec: s.sec + 1, phase: \u0027up\u0027, rep, set, clean });\n    } else {\n      const bad = (s.rep + 1) % 4 === 0;\n      const score = Math.max(70, Math.min(97, s.score + (bad ? -2 : 1)));\n      this.setState({ sec: s.sec + 1, phase: \u0027down\u0027, bad, score });\n    }\n  }\n  pose() {\n    const up = { head: [195, 222], neck: [195, 262], lS: [158, 276], rS: [232, 276], lE: [150, 340], rE: [240, 340], lW: [178, 318], rW: [212, 318], lH: [172, 418], rH: [218, 418], lK: [170, 512], rK: [220, 512], lA: [168, 604], rA: [222, 604] };\n    const down = { head: [195, 300], neck: [195, 340], lS: [158, 354], rS: [232, 354], lE: [146, 410], rE: [244, 410], lW: [180, 392], rW: [210, 392], lH: [164, 478], rH: [226, 478], lK: [134, 528], rK: [256, 528], lA: [156, 604], rA: [234, 604] };\n    const s = this.state;\n    const src = s.phase === \u0027up\u0027 ? up : Object.assign({}, down, s.bad ? { lK: [180, 534], rK: [210, 534] } : {});\n    const p = {};\n    Object.keys(src).forEach((k) =\u003e { p[k] = { x: src[k][0], y: src[k][1] }; });\n    p.headBase = p.head.y + 24;\n    p.goodLK = 134;\n    p.goodRK = 256;\n    return p;\n  }\n  renderVals() {\n    const s = this.state;\n    const bad = s.phase === \u0027down\u0027 \u0026\u0026 s.bad;\n    const coral = \u0027#FF5A3C\u0027;\n    const mm = Math.floor(s.sec / 60), ss = s.sec % 60;\n    const done = (s.set - 1) * 12 + s.rep;\n    const circ = 2 * Math.PI * 14;\n    let cue, cueSub;\n    if (bad) { cue = \u0027Push your knees out\u0027; cueSub = \u0027Knees are caving in — track them over your toes\u0027; }\n    else if (s.phase === \u0027down\u0027) { cue = \u0027Good depth — drive up!\u0027; cueSub = \u0027Hips below knees, chest up\u0027; }\n    else { cue = \u0027Nice rep — keep the pace\u0027; cueSub = \u0027Land soft, then drop straight back down\u0027; }\n    return {\n      p: this.pose(),\n      poseLabel: bad ? \u0027Body tracking: squat with knees caving inward\u0027 : \u0027Body tracking: squat with good form\u0027,\n      bad,\n      good: !bad,\n      legColor: bad ? coral : \u0027#FDEC06\u0027,\n      kneeColor: bad ? coral : \u0027#FFFFFF\u0027,\n      haloColor: bad ? coral : \u0027transparent\u0027,\n      guideColor: bad ? \u0027#FFFFFF\u0027 : \u0027transparent\u0027,\n      exerciseLabel: \u0027Exercise 1 of 5 · Set \u0027 + s.set + \u0027 of 3\u0027,\n      clock: (mm \u003c 10 ? \u00270\u0027 : \u0027\u0027) + mm + \u0027:\u0027 + (ss \u003c 10 ? \u00270\u0027 : \u0027\u0027) + ss,\n      progress: Math.round((done / 36) * 100) + \u0027%\u0027,\n      score: s.score,\n      scoreColor: s.score \u003e= 85 ? \u0027#FDEC06\u0027 : \u0027#FF8A00\u0027,\n      scoreDash: (circ * s.score / 100).toFixed(1) + \u0027 \u0027 + circ.toFixed(1),\n      formAria: \u0027Live form score \u0027 + s.score + \u0027 out of 100\u0027,\n      depth: s.phase === \u0027up\u0027 ? \u002714%\u0027 : (bad ? \u002778%\u0027 : \u002792%\u0027),\n      depthColor: bad ? coral : \u0027#FDEC06\u0027,\n      cue, cueSub,\n      cueBg: bad ? \u0027rgba(255, 90, 60, 0.18)\u0027 : \u0027rgba(18, 18, 18, 0.55)\u0027,\n      cueBorder: bad ? coral : \u0027rgba(253, 236, 6, 0.42)\u0027,\n      cueIconBg: bad ? coral : \u0027#FDEC06\u0027,\n      rep: s.rep,\n      setLabel: \u0027Set \u0027 + s.set + \u0027 of 3\u0027,\n      cleanLabel: s.clean + \u0027 clean reps so far\u0027,\n      paused: s.paused,\n      running: !s.paused,\n      togglePause: () =\u003e this.setState({ paused: !s.paused }),\n      pauseCls: s.paused ? \u0027cta\u0027 : \u0027glass\u0027,\n      pauseFg: s.paused ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n      pauseAria: s.paused ? \u0027Resume session\u0027 : \u0027Pause session\u0027\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","Auth":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Sign up or log in\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700\u0026amp;family=Manrope:wght@400;500;600;700;800\u0026amp;display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody{margin:0;background:#050505}\na{color:#FDEC06}a:hover{color:#FFF56B}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.orb{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none}\n.glass{background:linear-gradient(150deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 12px 32px rgba(0,0,0,0.35)}\n.glass-y{background:linear-gradient(150deg,rgba(253,236,6,0.26),rgba(253,236,6,0.07));border:1px solid rgba(253,236,6,0.42);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.16),0 12px 32px rgba(0,0,0,0.35)}\n.cta{background:#FDEC06;color:#000000;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 10px 30px rgba(253,23  aria-checked=\"{{ repeat }}\" aria-label=\"Repeat every week\" onClick=\"{{ toggleRepeat }}\" style=\"width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 0; background: {{ switchBg }}; position: relative; cursor: pointer; flex: none\"\u003e\n        \u003cspan style=\"position: absolute; top: 4px; left: {{ knobLeft }}; width: 24px; height: 24px; border-radius: 999px; background: {{ knobBg }}\"\u003e\u003c/span\u003e\n      \u003c/button\u003e\n    \u003c/div\u003e\n\n    \u003cbutton onClick=\"{{ save }}\" class=\"{{ saveCls }}\" style=\"height: 52px; box-sizing: border-box; border-radius: 16px; color: {{ saveFg }}; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 18px; text-transform: uppercase; cursor: pointer\"\u003e{{ saveLabel }}\u003c/button\u003e\n  \u003c/main\u003e\n\n  \u003cnav aria-label=\"Coach\" class=\"glass\" style=\"position: absolute; left: 14px; right: 14px; bottom: 18px; height: 68px; box-sizing: border-box; border-radius: 26px; padding: 0 6px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; background: rgba(22, 22, 22, 0.55)\"\u003e\n    \u003ca href=\"CoachHome.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: rgba(255, 255, 255, 0.72); font-size: 11px; font-weight: 700\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003crect x=\"3.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/\u003e\u003crect x=\"13.5\" y=\"3.5\" width=\"7\" height=\"7\" rx=\"1.5\"/\u003e\u003crect x=\"3.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/\u003e\u003crect x=\"13.5\" y=\"13.5\" width=\"7\" height=\"7\" rx=\"1.5\"/\u003e\u003c/svg\u003e\u003c/span\u003eDashboard\u003c/a\u003e\n    \u003ca href=\"PublishPlan.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: rgba(255, 255, 255, 0.72); font-size: 11px; font-weight: 700\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003crect x=\"5\" y=\"4.5\" width=\"14\" height=\"16.5\" rx=\"2\"/\u003e\u003cpath d=\"M9 4.5V3h6v1.5M9 10h6M9 14h6M9 18h3\"/\u003e\u003c/svg\u003e\u003c/span\u003eDiet plans\u003c/a\u003e\n    \u003ca href=\"Availability.dc.html\" aria-current=\"page\" style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #FDEC06; font-size: 11px; font-weight: 800\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; border-radius: 999px; background: rgba(253, 236, 6, 0.16); display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003crect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/\u003e\u003cpath d=\"M3.5 10h17M8 3v4M16 3v4\"/\u003e\u003c/svg\u003e\u003c/span\u003eSlots\u003c/a\u003e\n    \u003ca href=\"Clients.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: rgba(255, 255, 255, 0.72); font-size: 11px; font-weight: 700\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"9\" cy=\"8.5\" r=\"3.5\"/\u003e\u003cpath d=\"M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5\"/\u003e\u003cpath d=\"M15.5 5.2a3.5 3.5 0 0 1 0 6.6M17.5 14.8c2 .7 3.3 2.5 4 5.2\"/\u003e\u003c/svg\u003e\u003c/span\u003eClients\u003c/a\u003e\n  \u003c/nav\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":844}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { day: 2, toggled: {}, repeat: true, saved: false };\n  }\n  renderVals() {\n    const st = this.state;\n    const slotDefs = [\n      [\u00276a\u0027, \u00276:00 AM\u0027], [\u00277a\u0027, \u00277:00 AM\u0027], [\u00278a\u0027, \u00278:00 AM\u0027], [\u00279a\u0027, \u00279:00 AM\u0027],\n      [\u002712p\u0027, \u002712:00 PM\u0027], [\u00271p\u0027, \u00271:00 PM\u0027], [\u00272p\u0027, \u00272:00 PM\u0027], [\u00273p\u0027, \u00273:00 PM\u0027],\n      [\u00275p\u0027, \u00275:00 PM\u0027], [\u00276p\u0027, \u00276:00 PM\u0027], [\u00277p\u0027, \u00277:00 PM\u0027], [\u00278p\u0027, \u00278:00 PM\u0027]\n    ];\n    const week = [\n      { short: \u0027Mon\u0027, n: 19, long: \u0027Monday\u0027, booked: { \u00277a\u0027: \u0027Meera S.\u0027, \u00279a\u0027: \u0027Sneha P.\u0027, \u00275p\u0027: \u0027Rohan D.\u0027, \u00276p\u0027: \u0027Aarav M.\u0027, \u00277p\u0027: \u0027Kunal B.\u0027 }, off: [\u00276a\u0027, \u00278a\u0027, \u002712p\u0027, \u00271p\u0027, \u00272p\u0027, \u00273p\u0027] },\n      { short: \u0027Tue\u0027, n: 20, long: \u0027Tuesday\u0027, booked: { \u00277a\u0027: \u0027Ishaan R.\u0027, \u00271p\u0027: \u0027Priya K.\u0027, \u00275p\u0027: \u0027Dev S.\u0027, \u00277p\u0027: \u0027Nisha G.\u0027 }, off: [] },\n      { short: \u0027Wed\u0027, n: 21, long: \u0027Wednesday\u0027, booked: { \u00276a\u0027: \u0027Meera S.\u0027, \u00278a\u0027: \u0027Ishaan R.\u0027, \u00275p\u0027: \u0027Rohan D.\u0027, \u00277p\u0027: \u0027Kunal B.\u0027 }, off: [\u002712p\u0027] },\n      { short: \u0027Thu\u0027, n: 22, long: \u0027Thursday\u0027, booked: { \u00279a\u0027: \u0027Sneha P.\u0027, \u00276p\u0027: \u0027Aarav M.\u0027, \u00278p\u0027: \u0027Nisha G.\u0027 }, off: [\u00272p\u0027] },\n      { short: \u0027Fri\u0027, n: 23, long: \u0027Friday\u0027, booked: { \u00276a\u0027: \u0027Meera S.\u0027, \u00273p\u0027: \u0027Priya K.\u0027, \u00275p\u0027: \u0027Rohan D.\u0027 }, off: [\u00277a\u0027] },\n      { short: \u0027Sat\u0027, n: 24, long: \u0027Saturday\u0027, booked: { \u00278a\u0027: \u0027Dev S.\u0027, \u00279a\u0027: \u0027Ishaan R.\u0027 }, off: [\u002712p\u0027, \u00271p\u0027] },\n      { short: \u0027Sun\u0027, n: 25, long: \u0027Sunday\u0027, booked: {}, off: slotDefs.map(([id]) =\u003e id) }\n    ];\n    const isOpen = (di, id) =\u003e {\n      const d = week[di];\n      if (d.booked[id]) return false;\n      const base = d.off.indexOf(id) === -1;\n      return st.toggled[di + \u0027-\u0027 + id] ? !base : base;\n    };\n    const days = week.map((d, i) =\u003e {\n      const on = i === st.day;\n      const open = slotDefs.filter(([id]) =\u003e isOpen(i, id)).length;\n      return {\n        short: d.short,\n        n: d.n,\n        openLabel: open === 0 ? \u0027Off\u0027 : open + \u0027 open\u0027,\n        aria: d.long + \u0027 \u0027 + d.n + \u0027 October, \u0027 + open + \u0027 open slots\u0027,\n        pressed: on,\n        cls: on ? \u0027cta\u0027 : \u0027glass\u0027,\n        fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n        pick: () =\u003e this.setState({ day: i })\n      };\n    });\n    const d = week[st.day];\n    let nOpen = 0, nBooked = 0, nOff = 0;\n    const slots = slotDefs.map(([id, label]) =\u003e {\n      const who = d.booked[id];\n      const open = isOpen(st.day, id);\n      if (who) nBooked++; else if (open) nOpen++; else nOff++;\n      if (who) {\n        return { label, status: who, aria: label + \u0027, booked by \u0027 + who, booked: true, cls: \u0027\u0027, bg: \u0027rgba(255, 255, 255, 0.9)\u0027, fg: \u0027#000000\u0027, border: \u0027rgba(255, 255, 255, 0.9)\u0027, borderStyle: \u0027solid\u0027, statusColor: \u0027#000000\u0027, cursor: \u0027default\u0027, toggle: () =\u003e {} };\n      }\n      if (open) {\n        return { label, status: \u0027Open\u0027, aria: label + \u0027, open. Tap to close\u0027, booked: false, cls: \u0027glass\u0027, bg: \u0027transparent\u0027, fg: \u0027#FFFFFF\u0027, border: \u0027#FDEC06\u0027, borderStyle: \u0027solid\u0027, statusColor: \u0027#FDEC06\u0027, cursor: \u0027pointer\u0027, toggle: () =\u003e this.flip(id) };\n      }\n      return { label, status: \u0027Closed\u0027, aria: label + \u0027, closed. Tap to open\u0027, booked: false, cls: \u0027\u0027, bg: \u0027transparent\u0027, fg: \u0027rgba(255, 255, 255, 0.62)\u0027, border: \u0027rgba(255, 255, 255, 0.22)\u0027, borderStyle: \u0027dashed\u0027, statusColor: \u0027rgba(255, 255, 255, 0.62)\u0027, cursor: \u0027pointer\u0027, toggle: () =\u003e this.flip(id) };\n    });\n    return {\n      days, slots,\n      dayTitle: d.long + \u0027, \u0027 + d.n + \u0027 October\u0027,\n      daySummary: nOpen + \u0027 open · \u0027 + nBooked + \u0027 booked · \u0027 + nOff + \u0027 closed\u0027,\n      repeat: st.repeat,\n      toggleRepeat: () =\u003e this.setState({ repeat: !st.repeat, saved: false }),\n      switchBg: st.repeat ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.22)\u0027,\n      knobBg: st.repeat ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n      knobLeft: st.repeat ? \u002724px\u0027 : \u00274px\u0027,\n      save: () =\u003e this.setState({ saved: true }),\n      saveLabel: st.saved ? \u0027Saved · members see it now\u0027 : \u0027Save availability\u0027,\n      saveCls: st.saved ? \u0027glass-y\u0027 : \u0027cta\u0027,\n      saveFg: st.saved ? \u0027#FDEC06\u0027 : \u0027#000000\u0027\n    };\n  }\n  flip(id) {\n    const key = this.state.day + \u0027-\u0027 + id;\n    const toggled = { ...this.state.toggled, [key]: !this.state.toggled[key] };\n    this.setState({ toggled, saved: false });\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","BookSlot":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Book a slot\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e ; right: -140px; top: 620px; background: #FDEC06; opacity: 0.20\"\u003e\u003c/div\u003e\n\n  \u003cmain style=\"position: relative; padding: 52px 20px 170px; display: flex; flex-direction: column; gap: 16px\"\u003e\n\n    \u003cheader style=\"display: flex; align-items: center; justify-content: space-between\"\u003e\n      \u003ca href=\"Trainers.dc.html\" aria-label=\"Back to trainers\" class=\"glass\" style=\"width: 44px; height: 44px; box-sizing: border-box; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003cpath d=\"m15 5-7 7 7 7\"/\u003e\u003c/svg\u003e\n      \u003c/a\u003e\n      \u003ch1 style=\"margin: 0; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 21px; text-transform: uppercase\"\u003eBook a session\u003c/h1\u003e\n      \u003cdiv style=\"width: 44px; height: 44px\"\u003e\u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003csection aria-label=\"Your coach\" class=\"glass\" style=\"display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 20px\"\u003e\n      \u003cdiv aria-hidden=\"true\" class=\"cta\" style=\"width: 48px; height: 48px; flex: none; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 18px\"\u003eRK\u003c/div\u003e\n      \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; gap: 1px\"\u003e\n        \u003cspan style=\"font-size: 15px; font-weight: 800\"\u003eRhea Kapoor\u003c/span\u003e\n        \u003cspan style=\"display: flex; align-items: center; gap: 4px; font-size: 12px; color: rgba(255, 255, 255, 0.72)\"\u003eStrength \u0026amp; conditioning ·\n          \u003csvg viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 12px; height: 12px; fill: #FDEC06\"\u003e\u003cpath d=\"m12 3. yle: italic; font-weight: 700; font-size: 19px; text-transform: uppercase; cursor: {{ ctaCursor }}\"\u003eConfirm booking\u003c/button\u003e\n  \u003c/div\u003e\n\n  \u003csc-if value=\"{{ confirmed }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n    \u003cdiv style=\"position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: flex-end\"\u003e\n      \u003csection role=\"dialog\" aria-label=\"Booking confirmed\" class=\"glass\" style=\"background: rgba(24, 24, 24, 0.78); border-radius: 26px 26px 0 0; padding: 28px 20px 30px; display: flex; flex-direction: column; gap: 18px\"\u003e\n        \u003cdiv aria-hidden=\"true\" class=\"cta\" style=\"width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 32px; height: 32px; stroke-width: 2.6\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7\"/\u003e\u003c/svg\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px\"\u003e\n          \u003ch2 style=\"margin: 0; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 32px; line-height: 1; text-transform: uppercase\"\u003eYou\u0027re booked!\u003c/h2\u003e\n          \u003cspan style=\"font-size: 14px; color: rgba(255, 255, 255, 0.72)\"\u003eRhea will see you there. We\u0027ll remind you an hour before.\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdl class=\"glass\" style=\"margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 10px 16px; font-size: 14px; padding: 14px; border-radius: 16px\"\u003e\n          \u003cdt style=\"color: rgba(255, 255, 255, 0.72)\"\u003eCoach\u003c/dt\u003e\u003cdd style=\"margin: 0; font-weight: 800; text-align: right\"\u003eRhea Kapoor\u003c/dd\u003e\n          \u003cdt style=\"color: rgba(255, 255, 255, 0.72)\"\u003eWhen\u003c/dt\u003e\u003cdd style=\"margin: 0; font-weight: 800; text-align: right\"\u003e{{ whenLabel }}\u003c/dd\u003e\n          \u003cdt style=\"color: rgba(255, 255, 255, 0.72)\"\u003eSession\u003c/dt\u003e\u003cdd style=\"margin: 0; font-weight: 800; text-align: right\"\u003e{{ sessionLabel }}\u003c/dd\u003e\n          \u003cdt style=\"color: rgba(255, 255, 255, 0.72)\"\u003ePaid\u003c/dt\u003e\u003cdd style=\"margin: 0; font-weight: 800; text-align: right; color: #FDEC06\"\u003e{{ price }}\u003c/dd\u003e\n        \u003c/dl\u003e\n        \u003cdiv class=\"glass-y\" style=\"display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 14px; font-size: 13px; font-weight: 700\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 16px; height: 16px; color: #FDEC06\"\u003e\u003cpath d=\"M12 3.5 14 10l6.5 2-6.5 2-2 6.5-2-6.5-6.5-2L10 10Z\"/\u003e\u003c/svg\u003e\n          \u003cspan style=\"flex: 1\"\u003ePro member price · 10% off\u003c/span\u003e\n          \u003cspan style=\"font-weight: 800; color: #FDEC06\"\u003eSaved {{ saved }}\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"display: flex; gap: 10px\"\u003e\n          \u003cbutton class=\"glass\" style=\"flex: 1; height: 50px; border-radius: 14px; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 14px; cursor: pointer\"\u003eAdd to calendar\u003c/button\u003e\n          \u003cbutton class=\"cta\" onClick=\"{{ done }}\" style=\"flex: 1; height: 50px; border-radius: 14px; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 14px; cursor: pointer\"\u003eDone\u003c/button\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n    \u003c/div\u003e\n  \u003c/sc-if\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":844}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { dateIdx: 1, slot: \u00276p\u0027, mode: \u0027studio\u0027, dur: 60, confirmed: false };\n  }\n  renderVals() {\n    const s = this.state;\n    const days = [\n      { short: \u0027Today\u0027, n: 19, long: \u0027Monday\u0027, dname: \u0027Mon\u0027 },\n      { short: \u0027Tue\u0027, n: 20, long: \u0027Tuesday\u0027, dname: \u0027Tue\u0027 },\n      { short: \u0027Wed\u0027, n: 21, long: \u0027Wednesday\u0027, dname: \u0027Wed\u0027 },\n      { short: \u0027Thu\u0027, n: 22, long: \u0027Thursday\u0027, dname: \u0027Thu\u0027 },\n      { short: \u0027Fri\u0027, n: 23, long: \u0027Friday\u0027, dname: \u0027Fri\u0027 },\n      { short: \u0027Sat\u0027, n: 24, long: \u0027Saturday\u0027, dname: \u0027Sat\u0027 },\n      { short: \u0027Sun\u0027, n: 25, long: \u0027Sunday\u0027, dname: \u0027Sun\u0027, off: true }\n    ];\n    const booked = [\n      [\u00276a\u0027, \u00277a\u0027, \u00278a\u0027, \u00279a\u0027, \u002712p\u0027, \u00271p\u0027, \u00272p\u0027, \u00273p\u0027, \u00275p\u0027, \u00277p\u0027],\n      [\u00277a\u0027, \u00271p\u0027, \u00275p\u0027, \u00277p\u0027],\n      [\u00276a\u0027, \u00278a\u0027, \u002712p\u0027, \u00275p\u0027, \u00277p\u0027],\n      [\u00279a\u0027, \u00272p\u0027, \u00276p\u0027, \u00278p\u0027],\n      [\u00276a\u0027, \u00277a\u0027, \u00273p\u0027, \u00275p\u0027],\n      [\u00278a\u0027, \u00279a\u0027, \u002712p\u0027, \u00271p\u0027],\n      []\n    ];\n    const yours = { 0: \u00276p\u0027 };\n    const groupDefs = [\n      { title: \u0027Morning\u0027, slots: [[\u00276a\u0027, \u00276:00 AM\u0027], [\u00277a\u0027, \u00277:00 AM\u0027], [\u00278a\u0027, \u00278:00 AM\u0027], [\u00279a\u0027, \u00279:00 AM\u0027]] },\n      { title: \u0027Afternoon\u0027, slots: [[\u002712p\u0027, \u002712:00 PM\u0027], [\u00271p\u0027, \u00271:00 PM\u0027], [\u00272p\u0027, \u00272:00 PM\u0027], [\u00273p\u0027, \u00273:00 PM\u0027]] },\n      { title: \u0027Evening\u0027, slots: [[\u00275p\u0027, \u00275:00 PM\u0027], [\u00276p\u0027, \u00276:00 PM\u0027], [\u00277p\u0027, \u00277:00 PM\u0027], [\u00278p\u0027, \u00278:00 PM\u0027]] }\n    ];\n    const prices = {\n      45: { was: \u0027₹700\u0027, now: \u0027₹630\u0027, saved: \u0027₹70\u0027 },\n      60: { was: \u0027₹900\u0027, now: \u0027₹810\u0027, saved: \u0027₹90\u0027 },\n      90: { was: \u0027₹1,300\u0027, now: \u0027₹1,170\u0027, saved: \u0027₹130\u0027 }\n    };\n\n    const modes = [[\u0027studio\u0027, \u0027In-studio\u0027], [\u0027online\u0027, \u0027Online\u0027]].map(([id, label]) =\u003e {\n      const on = s.mode === id;\n      return { label, pressed: on, cls: on ? \u0027cta\u0027 : \u0027glass\u0027, fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027, pick: () =\u003e this.setState({ mode: id }) };\n    });\n    const durs = [45, 60, 90].map((m) =\u003e {\n      const on = s.dur === m;\n      return {\n        label: String(m),\n        aria: m + \u0027 minutes, \u0027 + prices[m].now + \u0027 member price\u0027,\n        pressed: on,\n        cls: on ? \u0027cta\u0027 : \u0027glass\u0027,\n        fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n        pick: () =\u003e this.setState({ dur: m })\n      };\n    });\n    const dates = days.map((d, i) =\u003e {\n      const on = i === s.dateIdx;\n      return {\n        short: d.short,\n        n: d.n,\n        aria: d.long + \u0027 \u0027 + d.n + \u0027 October\u0027 + (d.off ? \u0027, coach is off\u0027 : \u0027\u0027),\n        off: !!d.off,\n        pressed: on,\n        cls: on ? \u0027cta\u0027 : \u0027glass\u0027,\n        fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n        op: d.off ? \u00270.35\u0027 : \u00271\u0027,\n        cursor: d.off ? \u0027default\u0027 : \u0027pointer\u0027,\n        pick: () =\u003e this.setState({ dateIdx: i, slot: null })\n      };\n    });\n    const taken = booked[s.dateIdx];\n    const mine = yours[s.dateIdx];\n    let slotLabel = \u0027\u0027;\n    const groups = groupDefs.map((g) =\u003e ({\n      title: g.title,\n      slots: g.slots.map(([id, label]) =\u003e {\n        const isMine = mine === id;\n        const isTaken = taken.indexOf(id) !== -1;\n        const on = s.slot === id;\n        if (on) slotLabel = label;\n        let cls = \u0027glass\u0027, fg = \u0027#FFFFFF\u0027, borderStyle = \u0027solid\u0027, borderColor = \u0027rgba(255, 255, 255, 0.14)\u0027, op = \u00271\u0027, deco = \u0027none\u0027, aria = label + \u0027, open\u0027;\n        if (on) { cls = \u0027cta\u0027; fg = \u0027#000000\u0027; borderColor = \u0027#FDEC06\u0027; aria = label + \u0027, selected\u0027; }\n        else if (isMine) { cls = \u0027glass-y\u0027; fg = \u0027#FDEC06\u0027; borderStyle = \u0027dashed\u0027; borderColor = \u0027#FDEC06\u0027; aria = label + \u0027, your session\u0027; }\n        else if (isTaken) { op = \u00270.35\u0027; deco = \u0027line-through\u0027; aria = label + \u0027, unavailable\u0027; }\n        const disabled = isMine || isTaken;\n        return {\n          label, aria, cls, fg, borderStyle, borderColor, op, deco,\n          pressed: on,\n          disabled,\n          cursor: disabled ? \u0027default\u0027 : \u0027pointer\u0027,\n          pick: () =\u003e this.setState({ slot: id })\n        };\n      })\n    }));\n    const day = days[s.dateIdx];\n    const noSlot = !s.slot;\n    const dayName = s.dateIdx === 0 ? \u0027Today\u0027 : day.dname;\n    const summary = noSlot ? \u0027Pick a time slot\u0027 : dayName + \u0027, \u0027 + day.n + \u0027 Oct · \u0027 + slotLabel;\n    const modeLabel = s.mode === \u0027studio\u0027 ? \u0027In-studio\u0027 : \u0027Online\u0027;\n    const p = prices[s.dur];\n    return {\n      modes, durs, dates, groups, noSlot, summary,\n      summaryColor: noSlot ? \u0027rgba(255, 255, 255, 0.72)\u0027 : \u0027#FFFFFF\u0027,\n      wasPrice: p.was,\n      price: p.now,\n      saved: p.saved,\n      ctaCls: noSlot ? \u0027glass\u0027 : \u0027cta\u0027,\n      ctaFg: noSlot ? \u0027rgba(255, 255, 255, 0.45)\u0027 : \u0027#000000\u0027,\n      ctaCursor: noSlot ? \u0027default\u0027 : \u0027pointer\u0027,\n      confirmed: s.confirmed,\n      whenLabel: day.long + \u0027, \u0027 + day.n + \u0027 Oct · \u0027 + slotLabel,\n      sessionLabel: modeLabel + \u0027 · \u0027 + s.dur + \u0027 min\u0027,\n      confirm: () =\u003e { if (!noSlot) this.setState({ confirmed: true }); },\n      done: () =\u003e this.setState({ confirmed: false, slot: null })\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","ChatIntro":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Meet your AI coach\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700\u0026amp;family=Manrope:wght@400;500;600;700;800\u0026amp;display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody{margin:0;background:#050505}\na{color:#FDEC06}a:hover{color:#FFF56B}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.orb{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none}\n.glass{background:linear-gradient(150deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 12px 32px rgba(0,0,0,0.35)}\n.glass-y{background:linear-gradient(150deg,rgba(253,236,6,0.26),rgba(253,236,6,0.07));border:1px solid rgba(253,236,6,0.42);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.16),0 12px 32px rgba(0,0,0,0.35)}\n.cta{background:#FDEC06;color:#000000;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,0.7),0 10px 30px rgba(253,236,6,0.30)}\n.halo{animation:halo 2.4s ease-in-out infinite}\n@keyframes halo{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.12);opacity:.2}}\ninput::placeholder{color:rgba(255,255,255,0.5)}\ninput:focus{outline:none}\n\u003c/style\u003e\n\u003c/helmet\u003e\n\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; background: #050505; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; position: relative; overflow: hidden\"\u003e\n  \u003cdiv class=\"orb\" aria-hidden=\"true\" style=\"width: 360px; height: 360px; left: 15px; top: -120px; background: #FDEC06; opacity: 0.30\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"orb\" aria-hidden=\"true\" style=\"width: 280px; height: 280px; left: -150px; top: 420px; background: #FF8A00; opacity: 0.20\"\u003e\u003c/div\u003e\n  \u003cdiv class=\"orb\" aria-hidden=\"true\" style=\"width: 280px; height: 280px; right: -140px; bottom: -60px; background: #FDEC06; opacity: 0.16\"\u003e\u003c/div\u003e\n\n  \u003cmain style=\"position: relative; height: 100%; box-sizing: border-box; padding: 52px 20px 30px; display: flex; flex-direction: column; gap: 16px\"\u003e\n    \u003cheader style=\"display: flex; align-items: center; justify-content: space-between\"\u003e\n      \u003ca href=\"Home.dc.html\" class=\"glass\" aria-label=\"Back to home\" style=\"width: 44px; height: 44px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003cpath d=\"m15 5-7 7 7 7\"/\u003e\u003c/svg\u003e\n      \u003c/a\u003e\n      \u003cspan class=\"glass-y\" style=\"font-size: 11px; font-weight: 800; letter-spacing: 1px; padding: 6px 10px; border-radius: 999px; color: #FDEC06\"\u003eNEW · AI CHAT\u003c/span\u003e\n    \u003c/header\u003e\n\n    \u003csection style=\"display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; margin-top: 4px\"\u003e\n      \u003cdiv aria-hidden=\"true\" style=\"position: relative; width: 104px; height: 104px; display: flex; align-items: center; justify-content: center\"\u003e\n        \u003cspan class=\"halo\" style=\"position: absolute; inset: -10px; border-radius: 999px; border: 2px solid rgba(253, 236, 6, 0.55)\"\u003e\u003c/span\u003e\n        \u003cspan class=\"cta\" style=\"width: 96px; height: 96px; border-radius: 999px; display: flex; align-items: center; justify-content: center; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 34px\"\u003e{{ initial }}\u003c/span\u003e\n        \u003cspan class=\"glass\" style=\"position: absolute; right: -4px; bottom: 2px; width: 34px; height: 34px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #FDEC06; background: rgba(18, 18, 18, 0.7)\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"M12 3.5 14 10l6.5 2-6.5 2-2 6.5-2-6.5-6.5-2L10 10Z\"/\u003e\u003c/svg\u003e\u003c/span\u003e\n      \u003c/div\u003e\n      \u003ch1 style=\"margin: 0; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 34px; line-height: 1; text-transform: uppercase\"\u003eMeet {{ name }}\u003c/h1\u003e\n      \u003cp style=\"margin: 0; font-size: 14px; line-height: 1.5; color: rgba(255, 255, 255, 0.78); max-width: 300px\"\u003eYour 24/7 AI coach. {{ name }} knows your diet plan, your workouts and your form scores.\u003c/p\u003e\n    \u003c/section\u003e\n\n    \u003csection aria-label=\"What it can do\" class=\"glass\" style=\"border-radius: 22px; padding: 6px 16px; display: flex; flex-direction: column\"\u003e\n      \u003csc-for list=\"{{ skills }}\" as=\"s\" hint-placeholder-count=\"4\"\u003e\n        \u003cdiv style=\"display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid {{ s.line }}\"\u003e\n          \u003cspan class=\"glass-y\" aria-hidden=\"true\" style=\"width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: #FDEC06; flex: none\"\u003e\n            \u003csc-if value=\"{{ s.isMeal }}\" hint-placeholder-val=\"{{ true }}\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"M5 19c0-8 5-14 15-15-1 10-7 15-15 15Z\"/\u003e\u003cpath d=\"M5 19 13 11\"/\u003e\u003c/svg\u003e\u003c/sc-if\u003e\n            \u003csc-if value=\"{{ s.isLog }}\" hint-placeholder-val=\"{{ false }}\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"M4 8h3l2-3h6l2 3h3v11H4Z\"/\u003e\u003ccircle cx=\"12\" cy=\"13\" r=\"3.5\"/\u003e\u003c/svg\u003e\u003c/sc-if\u003e\n            \u003csc-if value=\"{{ s.isScore }}\" hint-placeholder-val=\"{{ false }}\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16\"/\u003e\u003ccircle cx=\"12\" cy=\"8.5\" r=\"1.8\"/\u003e\u003cpath d=\"M12 10.5v4M9 12.5l3-1 3 1\"/\u003e\u003c/svg\u003e\u003c/sc-if\u003e\n            \u003csc-if value=\"{{ s.isBook }}\" hint-placeholder-val=\"{{ false }}\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 18px; height: 18px\"\u003e\u003crect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/\u003e\u003cpath d=\"M3.5 10h17M8 3v4M16 3v4\"/\u003e\u003c/svg\u003e\u003c/sc-if\u003e\n          \u003c/span\u003e\n          \u003cspan style=\"flex: 1; display: flex; flex-direction: column; gap: 1px; text-align: left\"\u003e\n            \u003cspan style=\"font-size: 14px; font-weight: 800\"\u003e{{ s.title }}\u003c/span\u003e\n            \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.72)\"\u003e{{ s.sub }}\u003c/span\u003e\n          \u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/sc-for\u003e\n    \u003c/section\u003e\n\n    \u003csection aria-label=\"Name your coach\" style=\"display: flex; flex-direction: column; gap: 10px\"\u003e\n      \u003ch2 style=\"margin: 0; font-size: 12px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255, 255, 255, 0.72)\"\u003eGive your coach a name\u003c/h2\u003e\n      \u003cdiv role=\"group\" aria-label=\"Name ideas\" style=\"display: flex; gap: 8px; flex-wrap: wrap\"\u003e\n        \u003csc-for list=\"{{ chips }}\" as=\"c\" hint-placeholder-count=\"5\"\u003e\n          \u003cbutton class=\"{{ c.cls }}\" aria-pressed=\"{{ c.on }}\" onClick=\"{{ c.pick }}\" style=\"height: 38px; padding: 0 16px; border-radius: 999px; color: {{ c.fg }}; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 14px; cursor: pointer\"\u003e{{ c.label }}\u003c/button\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n      \u003clabel class=\"glass\" style=\"height: 48px; box-sizing: border-box; border-radius: 14px; padding: 0 14px; display: flex; align-items: center; gap: 10px\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px; color: rgba(255, 255, 255, 0.6)\"\u003e\u003cpath d=\"M4 20h4L19 9l-4-4L4 16Z\"/\u003e\u003cpath d=\"m13.5 6.5 4 4\"/\u003e\u003c/svg\u003e\n        \u003cspan style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap\"\u003eCustom name\u003c/span\u003e\n        \u003cinput type=\"text\" maxlength=\"14\" placeholder=\"Or type your own name\" value=\"{{ custom }}\" onChange=\"{{ onCustom }}\" style=\"flex: 1; min-width: 0; background: transparent; border: 0; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 700; font-size: 15px\"\u003e\n      \u003c/label\u003e\n    \u003c/section\u003e\n\n    \u003c 27, fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027, pick: () =\u003e this.setState({ pick: n, custom: \u0027\u0027 }) };\n    });\n    const skills = [\n      { title: \u0027Swap any meal in your plan\u0027, sub: \u0027Same calories, food you actually have\u0027, isMeal: true },\n      { title: \u0027Log food by chat or photo\u0027, sub: \u0027\"2 rotis and dal\" is enough\u0027, isLog: true },\n      { title: \u0027Explains your AI Coach scores\u0027, sub: \u0027What went wrong and how to fix it\u0027, isScore: true },\n      { title: \u0027Books PT and live classes\u0027, sub: \u0027Finds a free slot and confirms it\u0027, isBook: true }\n    ].map((k, i, arr) =\u003e Object.assign({ isMeal: false, isLog: false, isScore: false, isBook: false }, k, { line: i === arr.length - 1 ? \u0027transparent\u0027 : \u0027rgba(255, 255, 255, 0.10)\u0027 }));\n    return {\n      name,\n      initial: name.charAt(0).toUpperCase(),\n      chips,\n      skills,\n      custom: s.custom,\n      onCustom: (e) =\u003e this.setState({ custom: e.target.value })\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","Clients":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Clients\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700\u0026amp;family=Manrope:wght@400;500;600;700;800\u0026amp;display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody{margin:0;background:#050505}\na{color:#FDEC06}a:hover{color:#FFF56B}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.orb{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none}\n.glass{background:linear-gradient( nts\n      .filter((c) =\u003e st.filter === \u0027all\u0027 || c.groups.indexOf(st.filter) !== -1)\n      .filter((c) =\u003e needle === \u0027\u0027 || c.name.toLowerCase().indexOf(needle) !== -1);\n    const rows = matches.map((c, i) =\u003e {\n      const tone = tones[c.tone];\n      const nudged = !!st.nudged[c.id];\n      const even = i % 2 === 0;\n      return {\n        name: c.name,\n        initials: c.initials,\n        avCls: even ? \u0027cta\u0027 : \u0027glass-y\u0027,\n        avFg: even ? \u0027#000000\u0027 : \u0027#FDEC06\u0027,\n        tags: c.tags.map((t) =\u003e tagStyles[t]),\n        status: c.status,\n        statusFg: tone.fg,\n        statusWeight: tone.weight,\n        isReview: c.action === \u0027review\u0027,\n        isMessage: c.action === \u0027message\u0027,\n        isNudge: c.action === \u0027nudge\u0027,\n        reviewAria: \u0027Review \u0027 + c.name + \"\u0027s diet\",\n        messageAria: \u0027Message \u0027 + c.name,\n        nudgeLabel: nudged ? \u0027Nudged\u0027 : \u0027Nudge\u0027,\n        nudgeAria: (nudged ? \u0027Nudged \u0027 : \u0027Nudge \u0027) + c.name,\n        nudgePressed: nudged,\n        nudgeCls: nudged ? \u0027glass-y\u0027 : \u0027glass\u0027,\n        nudgeFg: nudged ? \u0027#FDEC06\u0027 : \u0027#FFFFFF\u0027,\n        nudge: () =\u003e this.toggleNudge(c.id)\n      };\n    });\n    const n = rows.length;\n    const due = matches.filter((c) =\u003e c.action === \u0027review\u0027).length;\n    return {\n      q: st.q,\n      onQ: (e) =\u003e this.setState({ q: e.target.value }),\n      chips,\n      rows,\n      hasRows: n \u003e 0,\n      isEmpty: n === 0,\n      countLabel: n + (n === 1 ? \u0027 client\u0027 : \u0027 clients\u0027),\n      dueLabel: due \u003e 0 ? due + (due === 1 ? \u0027 review due\u0027 : \u0027 reviews due\u0027) : \u0027No reviews due\u0027,\n      dueFg: due \u003e 0 ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.72)\u0027,\n      clearAll: () =\u003e this.setState({ q:
