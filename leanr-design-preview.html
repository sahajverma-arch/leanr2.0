als() {\n    const goal = this.state.goal;\n    const covers = {\n      yellow: { cls: \u0027cta\u0027, fg: \u0027#000000\u0027 },\n      white: { cls: \u0027glass\u0027, fg: \u0027#FFFFFF\u0027 },\n      dark: { cls: \u0027glass-y\u0027, fg: \u0027#FDEC06\u0027 }\n    };\n    const tiers = {\n      all: { badge: \u0027ALL\u0027, cls: \u0027glass\u0027, fg: \u0027#FFFFFF\u0027, aria: \u0027Included for all members\u0027 },\n      pro: { badge: \u0027PRO\u0027, cls: \u0027glass-y\u0027, fg: \u0027#FDEC06\u0027, aria: \u0027Included with Pro and Elite\u0027 }\n    };\n    const all = [\n      { id: \u0027lean\u0027, title: \u0027Lean Cut 30\u0027, coach: \u0027Dt. Neha Sharma\u0027, goals: [\u0027fat\u0027], big: \u002730\u0027, unit: \u0027days\u0027, kcal: \u00271,700 kcal\u0027, diet: \u0027Veg + non-veg\u0027, rating: \u00274.9\u0027, tier: \u0027all\u0027, cover: \u0027yellow\u0027 },\n      { id: \u0027fuel\u0027, title: \u0027Muscle Fuel\u0027, coach: \u0027Coach Arjun Mehta\u0027, goals: [\u0027muscle\u0027], big: \u00278\u0027, unit: \u0027weeks\u0027, kcal: \u00272,600 kcal\u0027, diet: \u0027Non-veg\u0027, rating: \u00274.8\u0027, tier: \u0027pro\u0027, cover: \u0027white\u0027 },\n      { id: \u0027green\u0027, title: \u0027Green Power\u0027, coach: \u0027Dt. Priya Nair\u0027, goals: [\u0027veg\u0027, \u0027fat\u0027], big: \u002721\u0027, unit: \u0027days\u0027, kcal: \u00271,900 kcal\u0027, diet: \u0027Vegetarian\u0027, rating: \u00274.7\u0027, tier: \u0027all\u0027, cover: \u0027dark\u0027 },\n      { id: \u0027keto\u0027, title: \u0027Keto Kickstart\u0027, coach: \u0027Dt. Karan Malhotra\u0027, goals: [\u0027keto\u0027, \u0027fat\u0027], big: \u002714\u0027, unit: \u0027days\u0027, kcal: \u00271,500 kcal\u0027, diet: \u0027Keto\u0027, rating: \u00274.6\u0027, tier: \u0027all\u0027, cover: \u0027yellow\u0027 },\n      { id: \u0027pcos\u0027, title: \u0027PCOS Balance\u0027, coach: \u0027Dt. Neha Sharma\u0027, goals: [\u0027pcos\u0027], big: \u002728\u0027, unit: \u0027days\u0027, kcal: \u00271,600 kcal\u0027, diet: \u0027Vegetarian\u0027, rating: \u00274.9\u0027, tier: \u0027pro\u0027, cover: \u0027white\u0027 },\n      { id: \u0027desi\u0027, title: \u0027Desi High-Protein\u0027, coach: \u0027Coach Arjun Mehta\u0027, goals: [\u0027muscle\u0027, \u0027veg\u0027], big: \u00274\u0027, unit: \u0027weeks\u0027, kcal: \u00272,200 kcal\u0027, diet: \u0027Vegetarian\u0027, rating: \u00274.8\u0027, tier: \u0027pro\u0027, cover: \u0027dark\u0027 }\n    ];\n    const chipDefs = [\n      { id: \u0027all\u0027, label: \u0027All\u0027 },\n      { id: \u0027fat\u0027, label: \u0027Fat loss\u0027 },\n      { id: \u0027muscle\u0027, label: \u0027Muscle gain\u0027 },\n      { id: \u0027veg\u0027, label: \u0027Vegetarian\u0027 },\n      { id: \u0027keto\u0027, label: \u0027Keto\u0027 },\n      { id: \u0027pcos\u0027, label: \u0027PCOS\u0027 }\n    ];\n    const chips = chipDefs.map((c) =\u003e {\n      const on = c.id === goal;\n      return {\n        label: c.label,\n        pressed: on,\n        cls: on ? \u0027cta\u0027 : \u0027glass\u0027,\n        fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n        weight: on ? 800 : 700,\n        pick: () =\u003e this.setState({ goal: c.id })\n      };\n    });\n    const showFeatured = goal === \u0027all\u0027;\n    const filtered = all\n      .filter((p) =\u003e (goal === \u0027all\u0027 ? p.id !== \u0027lean\u0027 : p.goals.indexOf(goal) !== -1))\n      .map((p) =\u003e {\n        const cv = covers[p.cover];\n        const tr = tiers[p.tier];\n        return {\n          ...p,\n          coverCls: cv.cls,\n          coverFg: cv.fg,\n          badge: tr.badge,\n          badgeCls: tr.cls,\n          badgeFg: tr.fg,\n          badgeAria: tr.aria\n        };\n      });\n    const countLabel = showFeatured ? \u0027More plans\u0027 : filtered.length + (filtered.length === 1 ? \u0027 plan\u0027 : \u0027 plans\u0027);\n    return { chips, showFeatured, plans: filtered, countLabel };\n tyle=\"font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #FDEC06\"\u003e{{ k.catLabel }}\u003c/span\u003e\n            \u003ch3 style=\"margin: 0; font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\"\u003e{{ k.title }}\u003c/h3\u003e\n            \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.72); white-space: nowrap; overflow: hidden; text-overflow: ellipsis\"\u003e{{ k.meta }}\u003c/span\u003e\n          \u003c/div\u003e\n          \u003csc-if value=\"{{ k.ended }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n            \u003cbutton class=\"glass\" style=\"height: 38px; padding: 0 12px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; gap: 5px; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 12px; cursor: pointer; flex: none\"\u003e\n              \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 14px; height: 14px\"\u003e\u003cpath d=\"M7 5v14l11-7Z\"/\u003e\u003c/svg\u003eReplay\u003c/button\u003e\n          \u003c/sc-if\u003e\n          \u003csc-if value=\"{{ k.upcoming }}\" hint-placeholder-val=\"{{ true }}\"\u003e\n            \u003cbutton class=\"{{ k.remCls }}\" aria-pressed=\"{{ k.reminded }}\" aria-label=\"{{ k.remAria }}\" onClick=\"{{ k.toggle }}\" style=\"height: 38px; padding: 0 12px; border-radius: 999px; color: {{ k.remFg }}; display: flex; align-items: center; gap: 5px; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 12px; cursor: pointer; flex: none\"\u003e\n              \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 14px; height: 14px\"\u003e\u003cpath d=\"M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15Z\"/\u003e\u003cpath d=\"M10 20.5a2 2 0 0 0 4 0\"/\u003e\u003c/svg\u003e{{ k.remLabel }}\u003c/button\u003e\n          \u003c/sc-if\u003e\n        \u003c/article\u003e\n      \u003c/sc-for\u003e\n    \u003c/div\u \" style=\"width: 26px; height: 26px; stroke-width: 2\"\u003e\u003cpath d=\"M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16\"/\u003e\u003ccircle cx=\"12\" cy=\"8.5\" r=\"1.8\"/\u003e\u003cpath d=\"M12 10.5v4M9 12.5l3-1 3 1M10 18l2-3.5 2 3.5\"/\u003e\u003c/svg\u003e\u003c/span\u003eAI Coach\u003c/a\u003e\n    \u003ca href=\"Live.dc.html\" aria-current=\"page\" style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: #FDEC06; font-size: 11px; font-weight: 800\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; border-radius: 999px; background: rgba(253, 236, 6, 0.16); display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"12\" r=\"2.2\"/\u003e\u003cpath d=\"M7.8 7.8a6 6 0 0 0 0 8.4M16.2 7.8a6 6 0 0 1 0 8.4M5 5a10 10 0 0 0 0 14M19 5a10 10 0 0 1 0 14\"/\u003e\u003c/svg\u003e\u003c/span\u003eLive\u003c/a\u003e\n    \u003ca href=\"Profile.dc.html\" style=\"display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: rgba(255, 255, 255, 0.72); font-size: 11px; font-weight: 700\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/\u003e\u003cpath d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"/\u003e\u003c/svg\u003e\u003c/span\u003eProfile\u003c/a\u003e\n  \u003c/nav\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":1080}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { day: 0, cat: \u0027all\u0027, reminders: { c4: true } };\n  }\n  renderVals() {\n    const s = this.state;\n    const dayDefs = [\n      [\u0027Today\u0027, 19, \u0027Monday\u0027], [\u0027Tue\u0027, 20, \u0027Tuesday\u0027], [\u0027Wed\u0027, 21, \u0027Wednesday\u0027], [\u0027Thu\u0027, 22, \u0027Thursday\u0027],\n      [\u0027Fri\u0027, 23, \u0027Friday\u0027], [\u0027Sat\u0027, 24, \u0027Saturday\u0027], [\u0027Sun\u0027, 25, \u0027Sunday\u0027]\n    ];\n    const catDefs = [\n      [\u0027all\u0027, \u0027All\u0027], [\u0027yoga\u0027, \u0027Yoga\u0027], [\u0027hiit\u0027, \u0027HIIT\u0027], [\u0027zumba\u0027, \u0027Zumba\u0027],\n      [\u0027strength\u0027, \u0027Strength\u0027], [\u0027pilates\u0027, \u0027Pilates\u0027], [\u0027meditate\u0027, \u0027Meditation\u0027]\n    ];\n    const catName = {};\n    catDefs.forEach(([id, label]) =\u003e { catName[id] = label; });\n    const schedule = [\n      { id: \u0027c1\u0027, time: \u00277:00\u0027, ampm: \u0027AM\u0027, title: \u0027Morning Vinyasa Flow\u0027, coach: \u0027Ananya Rao\u0027, cat: \u0027yoga\u0027, level: \u0027All levels\u0027, mins: 45, today: \u0027ended\u0027 },\n      { id: \u0027c2\u0027, time: \u00278:30\u0027, ampm: \u0027AM\u0027, title: \u0027Fat-burn HIIT\u0027, coach: \u0027Vikram Singh\u0027, cat: \u0027hiit\u0027, level: \u0027Intermediate\u0027, mins: 30, today: \u0027ended\u0027 },\n      { id: \u0027c3\u0027, time: \u00271:30\u0027, ampm: \u0027PM\u0027, title: \u0027Power Yoga\u0027, coach: \u0027Ananya Rao\u0027, cat: \u0027yoga\u0027, level: \u0027All levels\u0027, mins: 45, today: \u0027live\u0027 },\n      { id: \u0027c4\u0027, time: \u00276:00\u0027, ampm: \u0027PM\u0027, title: \u0027Bollywood Zumba\u0027, coach: \u0027Tanvi Joshi\u0027, cat: \u0027zumba\u0027, level: \u0027All levels\u0027, mins: 45, today: \u0027upcoming\u0027 },\n      { id: \u0027c5\u0027, time: \u00277:30\u0027, ampm: \u0027PM\u0027, title: \u0027Full-body Strength\u0027, coach: \u0027Kabir Khan\u0027, cat: \u0027strength\u0027, level: \u0027Intermediate\u0027, mins: 40, today: \u0027upcoming\u0027 },\n      { id: \u0027c6\u0027, time: \u00278:30\u0027, ampm: \u0027PM\u0027, title: \u0027Core Pilates\u0027, coach: \u0027Tanvi Joshi\u0027, cat: \u0027pilates\u0027, level: \u0027Beginner\u0027, mins: 30, today: \u0027upcoming\u0027 },\n      { id: \u0027c7\u0027, time: \u00279:30\u0027, ampm: \u0027PM\u0027, title: \u0027Sleep Meditation\u0027, coach: \u0027Meera Iyer\u0027, cat: \u0027meditate\u0027, level: \u0027All levels\u0027, mins: 15, today: \u0027upcoming\u0027 }\n    ];\n    const isToday = s.day === 0;\n    const pill = (on) =\u003e ({ cls: on ? \u0027cta\u0027 : \u0027glass\u0027, fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027 });\n    const days = dayDefs.map(([short, n, long], i) =\u003e ({\n      short, n, on: i === s.day, aria: long + \u0027 \u0027 + n + \u0027 October\u0027, ...pill(i === s.day),\n      pick: () =\u003e this.setState({ day: i })\n    }));\n    const cats = catDefs.map(([id, label]) =\u003e ({\n      label, on: id === s.cat, ...pill(id === s.cat),\n      pick: () =\u003e this.setState({ cat: id })\n    }));\n    const showHero = isToday \u0026\u0026 (s.cat === \u0027all\u0027 || s.cat === \u0027yoga\u0027);\n    const classes = schedule\n      .filter((c) =\u003e s.cat === \u0027all\u0027 || c.cat === s.cat)\n      .filter((c) =\u003e !(isToday \u0026\u0026 c.today === \u0027live\u0027))\n      .map((c) =\u003e {\n        const status = isToday ? c.today : \u0027upcoming\u0027;\n        const key = s.day + \u0027-\u0027 + c.id;\n        const reminded = !!s.reminders[isToday ? c.id : key];\n        return {\n          time: c.time, ampm: c.ampm, title: c.title,\n          catLabel: catName[c.cat],\n          meta: c.coach + \u0027 · \u0027 + c.level + \u0027 · \u0027 + c.mins + \u0027 min\u0027,\n          ended: status === \u0027ended\u0027,\n          upcoming: status === \u0027upcoming\u0027,\n          reminded,\n          remCls: reminded ? \u0027glass-y\u0027 : \u0027glass\u0027,\n          remFg: reminded ? \u0027#FDEC06\u0027 : \u0027#FFFFFF\u0027,\n          remLabel: reminded ? \u0027Set\u0027 : \u0027Remind\u0027,\n          remAria: (reminded ? \u0027Reminder set for \u0027 : \u0027Remind me about \u0027) + c.title,\n          toggle: () =\u003e {\n            const r = { ...this.state.reminders };\n            const k = isToday ? c.id : key;\n            r[k] = !r[k];\n            this.setState({ reminders: r });\n          }\n        };\n      });\n    const dayLabel = isToday ? \"Today\u0027s schedule\" : dayDefs[s.day][2] + \"\u0027s schedule\";\n    return {\n      days, cats, classes, showHero,\n      isEmpty: classes.length === 0,\n      listTitle: dayLabel,\n      countLabel: classes.length + (classes.length === 1 ? \u0027 class\u0027 : \u0027 classes\u0027)\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","LiveClass":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Live class\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head\u003e\n\u003cbody\u003e\n\u003cx-dc\u003e\n\u003chelmet\u003e\n\u003clink href=\"https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600;1,700\u0026amp;family=Manrope:wght@400;500;600;700;800\u0026amp;display=swap\" rel=\"stylesheet\"\u003e\n\u003cstyle\u003e\nbody{margin:0;background:#050505}\na{color:#FDEC06}a:hover{color:#FFF56B}\n.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}\n.orb{position:absolute;border-radius:999px;filter:blur(70px);pointer-events:none}\n.glass{background:linear-gradient(150deg,rgba(255,255,255,0.12),rgba(255,255,255,0.04));border:1px solid rgba(255,255,255,0.14);-webkit-backdrop-filter:blur(22px) saturate(160%);backdrop-filter:blur(22px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,0.12),0 12px 32px rgba(0,0,0,0.35)}\n.glass-y{back r = cur.filter((x) =\u003e x !== \u0027none\u0027);\n        cur = cur.indexOf(id) !== -1 ? cur.filter((x) =\u003e x !== id) : cur.concat([id]);\n      }\n      a[q.id] = cur;\n    } else {\n      a[q.id] = id;\n    }\n    this.setState({ a });\n  }\n  bump(q, d) {\n    const a = { ...this.state.a };\n    a[q.id] = Math.min(q.max, Math.max(q.min, (a[q.id] || q.min) + d));\n    this.setState({ a });\n  }\n  labelFor(id, value) {\n    const q = this.Q.find((x) =\u003e x.id === id);\n    const o = q \u0026\u0026 q.options ? q.options.find((x) =\u003e x[0] === value) : null;\n    return o ? o[1] : \u0027\u0027;\n  }\n  renderVals() {\n    const s = this.state;\n    const q = this.Q[s.q];\n    const a = s.a;\n    const val = a[q.id];\n    const isMulti = q.type === \u0027multi\u0027;\n    const answered = q.type === \u0027number\u0027 ? true : (isMulti ? (val || []).length \u003e 0 : !!val);\n\n    const options = (q.options || []).map(([id, label, desc]) =\u003e {\n      const on = isMulti ? (val || []).indexOf(id) !== -1 : val === id;\n      return {\n        label, desc: desc || \u0027\u0027, hasDesc: !!desc, on,\n        cls: on ? \u0027glass-y\u0027 : \u0027glass\u0027,\n        border: on ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.14)\u0027,\n        ring: on ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.35)\u0027,\n        fill: on ? \u0027#FDEC06\u0027 : \u0027transparent\u0027,\n        shape: isMulti ? \u00277px\u0027 : \u0027999px\u0027,\n        pick: () =\u003e this.pick(q, id)\n      };\n    });\n\n    let ticks = [];\n    let hint = \u0027\u0027;\n    if (q.type === \u0027number\u0027) {\n      for (let v = val - 12; v \u003c= val + 12; v++) {\n        const major = v % 5 === 0;\n        const cur = v === val;\n        ticks.push({\n          w: cur ? \u00274px\u0027 : \u00272px\u0027,\n          h: cur ? \u002740px\u0027 : (major ? \u002726px\u0027 : \u002714px\u0027),\n          bg: cur ? \u0027#FDEC06\u0027 : (major ? \u0027rgba(255, 255, 255, 0.5)\u0027 : \u0027rgba(255, 255, 255, 0.22)\u0027),\n          label: major \u0026\u0026 !cur ? String(v) : \u0027\u0027\n        });\n      }\n      if (q.id === \u0027height\u0027) hint = \u0027Tip: measure without shoes, standing against a wall.\u0027;\n      if (q.id === \u0027weight\u0027) hint = \u0027Weigh yourself in the morning for the most consistent number.\u0027;\n      if (q.id === \u0027target\u0027) {\n        const diff = a.weight - a.target;\n        if (diff \u003e 0) hint = \"That\u0027s \" + diff + \u0027 kg to lose. A steady 0.5–1 kg a week is a healthy pace.\u0027;\n        else if (diff \u003c 0) hint = \"That\u0027s \" + (-diff) + \u0027 kg to gain. Your plan will add lean muscle gradually.\u0027;\n        else hint = \"Same as today — we\u0027ll focus on staying strong and fit.\";\n      }\n    }\n\n    const segs = this.Q.map((x, i) =\u003e ({\n      bg: i \u003c= s.q ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.16)\u0027,\n      glow: i === s.q ? \u00270 0 10px rgba(253, 236, 6, 0.8)\u0027 : \u0027none\u0027\n    }));\n\n    const isLast = s.q === this.Q.length - 1;\n    const useGrid = isMulti || (q.options \u0026\u0026 q.options.length \u003e 5 \u0026\u0026 !q.options[0][2]);\n\n    // results\n    const ageMid = { \u002718\u0027: 21, \u002725\u0027: 29, \u002735\u0027: 39, \u002745\u0027: 49, \u002755\u0027: 60 }[a.age] || 29;\n    const sexAdj = a.gender === \u0027f\u0027 ? -161 : (a.gender === \u0027m\u0027 ? 5 : -78);\n    const bmr = 10 * a.weight + 6.25 * a.height - 5 * ageMid + sexAdj;\n    const mult = { sit: 1.2, light: 1.375, active: 1.55, very: 1.725 }[a.activity] || 1.375;\n    const adj = { lose: -500, muscle: 300, fit: 0, flex: 0, health: -250 }[a.goal] || 0;\n    const kcal = Math.max(1200, Math.round((bmr * mult + adj) / 50) * 50);\n    const protein = Math.round(a.weight * (a.goal === \u0027muscle\u0027 ? 2 : 1.6));\n    const likes = (a.likes || []).map((id) =\u003e this.labelFor(\u0027likes\u0027, id)).sl ; color: #FDEC06; font-size: 11px; font-weight: 800\"\u003e\n      \u003cspan style=\"width: 46px; height: 28px; border-radius: 999px; background: rgba(253, 236, 6, 0.16); display: flex; align-items: center; justify-content: center\"\u003e\u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003ccircle cx=\"12\" cy=\"8\" r=\"4\"/\u003e\u003cpath d=\"M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6\"/\u003e\u003c/svg\u003e\u003c/span\u003eProfile\u003c/a\u003e\n  \u003c/nav\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":1240}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { weight: 71.6, logged: false, remind: true };\n  }\n  renderVals() {\n    const s = this.state;\n    const start = 72.0;\n    const goal = 66.0;\n    const lost = Math.max(0, start - s.weight);\n    const pct = Math.min(100, Math.round((lost / (start - goal)) * 100));\n    return {\n      current: s.weight.toFixed(1),\n      change: lost \u003e 0 ? \u0027−\u0027 + lost.toFixed(1) + \u0027 kg so far\u0027 : \u0027Just getting started\u0027,\n      pct: Math.max(pct, 2) + \u0027%\u0027,\n      logLabel: s.logged ? \u0027Logged today\u0027 : \u0027Log today\u0027,\n      logWeight: () =\u003e { if (!s.logged) this.setState({ weight: Math.round((s.weight - 0.2) * 10) / 10, logged: true }); },\n      remind: s.remind,\n      toggleRemind: () =\u003e this.setState({ remind: !s.remind }),\n      swBg: s.remind ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.22)\u0027,\n      knobBg: s.remind ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n      knobLeft: s.remind ? \u002724px\u0027 : \u00274px\u0027\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","PublishPlan":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Publish a diet pl .5 4.5\"/\u003e\u003c/svg\u003e\n      \u003cspan style=\"font-size: 14px; font-weight: 800\"\u003eAdd cover photo\u003c/span\u003e\n      \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.72)\"\u003eJPG or PNG · shown on the plan card\u003c/span\u003e\n    \u003c/button\u003e\n\n    \u003clabel style=\"display: flex; flex-direction: column; gap: 8px\"\u003e\n      \u003cspan style=\"font-size: 13px; font-weight: 800; color: rgba(255, 255, 255, 0.8)\"\u003ePlan name\u003c/span\u003e\n      \u003cinput type=\"text\" value=\"{{ name }}\" onChange=\"{{ onName }}\" style=\"height: 50px; box-sizing: border-box; padding: 0 14px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, 0.16); background: rgba(255, 255, 255, 0.06); color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 700; font-size: 16px\"\u003e\n    \u003c/label\u003e\n\n    \u003cdiv role=\"group\" aria-label=\"Goal\" style=\"display: flex; flex-direction: column; gap: 8px\"\u003e\n      \u003cspan style=\"font-size: 13px; font-weight: 800; color: rgba(255, 255, 255, 0.8)\"\u003eGoal\u003c/span\u003e\n      \u003cdiv style=\"display: flex; flex-wrap: wrap; gap: 8px\"\u003e\n        \u003csc-for list=\"{{ goals }}\" as=\"g\" hint-placeholder-count=\"5\"\u003e\n          \u003cbutton aria-pressed=\"{{ g.pressed }}\" onClick=\"{{ g.pick }}\" class=\"{{ g.cls }}\" style=\"height: 38px; box-sizing: border-box; padding: 0 16px; border-radius: 999px; color: {{ g.fg }}; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer\"\u003e{{ g.label }}\u003c/button\u003e\n        \u003c/sc-for\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px\"\u003e\n      \u003cdiv role=\"group\" aria-label=\"Duration\" style=\"display: flex; flex-direction: column; gap: 8px\"\u003e\n        \u003cspan style=\"font-size: 13px; font-weight: 800; color: rgba le=\"display: flex; flex-direction: column; gap: 8px\"\u003e\n        \u003csc-for list=\"{{ meals }}\" as=\"m\" hint-placeholder-count=\"4\"\u003e\n          \u003cdiv class=\"glass\" style=\"display: flex; align-items: center; gap: 12px; padding: 8px 6px 8px 14px; border-radius: 16px\"\u003e\n            \u003cdiv style=\"flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\"\u003e\n              \u003cspan style=\"font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #FDEC06\"\u003e{{ m.slot }} · {{ m.time }}\u003c/span\u003e\n              \u003cspan style=\"font-size: 14px; font-weight: 700\"\u003e{{ m.name }}\u003c/span\u003e\n            \u003c/div\u003e\n            \u003cspan style=\"font-family: \u0027Chakra Petch\u0027, sans-serif; font-weight: 600; font-size: 14px; color: rgba(255, 255, 255, 0.8); flex: none\"\u003e{{ m.kcal }}\u003c/span\u003e\n            \u003cbutton aria-label=\"{{ m.editLabel }}\" style=\"width: 36px; height: 36px; border: 0; border-radius: 10px; padding: 0; background: transparent; color: rgba(255, 255, 255, 0.72); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none\"\u003e\n              \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px\"\u003e\u003cpath d=\"M4 20h4L19 9l-4-4L4 16Z\"/\u003e\u003cpath d=\"m13.5 6.5 4 4\"/\u003e\u003c/svg\u003e\n            \u003c/button\u003e\n          \u003c/div\u003e\n        \u003c/sc-for\u003e\n        \u003cbutton style=\"height: 48px; box-sizing: border-box; border-radius: 16px; border: 1.5px dashed #FDEC06; background: rgba(253, 236, 6, 0.06); color: #FDEC06; display: flex; align-items: center; justify-content: center; gap: 6px; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 14px; cursor: pointer\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px\"\u003e\u00 "2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n        \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; gap: 3px\"\u003e\n          \u003cspan style=\"font-size: 13px; font-weight: 800\"\u003e{{ accessHint }}\u003c/span\u003e\n          \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.8); line-height: 1.4\"\u003eMembers unlock plans through their Leanr membership — no separate price.\u003c/span\u003e\n        \u003c/div\u003e\n      \u003c/div\u003e\n    \u003c/div\u003e\n\n    \u003cdiv class=\"glass\" style=\"display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 18px\"\u003e\n      \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; gap: 2px\"\u003e\n        \u003cspan style=\"font-size: 14px; font-weight: 800\"\u003eList on the Leanr marketplace\u003c/span\u003e\n        \u003cspan style=\"font-size: 12px; color: rgba(255, 255, 255, 0.72)\"\u003eOff = only clients you invite can see it\u003c/span\u003e\n      \u003c/div\u003e\n      \u003cbutton role=\"switch\" aria-checked=\"{{ listed }}\" aria-label=\"List on the Leanr marketplace\" onClick=\"{{ toggleListed }}\" style=\"width: 52px; height: 32px; border-radius: 999px; border: 0; padding: 0; background: {{ switchBg }}; position: relative; cursor: pointer; flex: none\"\u003e\n        \u003cspan style=\"position: absolute; top: 4px; left: {{ knobLeft }}; width: 24px; height: 24px; border-radius: 999px; background: {{ knobBg }}\"\u003e\u003c/span\u003e\n      \u003c/button\u003e\n    \u003c/div\u003e\n  \u003c/main\u003e\n\n  \u003cdiv class=\"glass\" style=\"position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 14px 20px 28px; background: rgba(18, 18, 18, 0.6); border-radius: 24px 24px 0 0; border-bottom: 0; display: flex; gap: 10px\"\u003e\n    \u003cbutton class=\"glass\" style=\"width: 120px; height: 54px; box-sizing: border-box; border-radius: 16px; color: #FFFFFF; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 15px; cursor: pointer\"\u003ePreview\u003c/button\u003e\n    \u003cbutton onClick=\"{{ publish }}\" class=\"cta\" style=\"flex: 1; height: 54px; border-radius: 16px; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 19px; text-transform: uppercase; cursor: pointer\"\u003ePublish plan\u003c/button\u003e\n  \u003c/div\u003e\n\n  \u003csc-if value=\"{{ published }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n    \u003cdiv style=\"position: absolute; inset: 0; background: rgba(0, 0, 0, 0.6); display: flex; flex-direction: column; justify-content: flex-end\"\u003e\n      \u003csection role=\"dialog\" aria-label=\"Plan published\" class=\"glass\" style=\"background: rgba(24, 24, 24, 0.78); border-radius: 26px 26px 0 0; border-bottom: 0; padding: 28px 20px 30px; display: flex; flex-direction: column; gap: 18px\"\u003e\n        \u003cdiv aria-hidden=\"true\" class=\"cta\" style=\"width: 64px; height: 64px; border-radius: 20px; display: flex; align-items: center; justify-content: center\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" style=\"width: 32px; height: 32px; stroke-width: 2.6\"\u003e\u003cpath d=\"m5 12.5 4.5 4.5L19 7\"/\u003e\u003c/svg\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 6px\"\u003e\n          \u003ch2 style=\"margin: 0; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 30px; line-height: 1; text-transform: uppercase\"\u003ePlan is live!\u003c/h2\u003e\n          \u003cspan style=\"font-size: 14px; line-height: 1.45; color: rgba(255, 255, 255, 0.8)\"\u003e{{ liveNote }}\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv class=\"glass-y\" style=\"display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px\"\u003e\n          \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 18px; height: 18px; color: #FDEC06\"\u003e\u003crect x=\"5\" y=\"10.5\" width=\"14\" height=\"10\" rx=\"2\"/\u003e\u003cpath d=\"M8 10.5V7.5a4 4 0 0 1 8 0v3\"/\u003e\u003c/svg\u003e\n          \u003cspan style=\"flex: 1; font-size: 13px; font-weight: 700\"\u003eWho can access\u003c/span\u003e\n          \u003cspan style=\"font-size: 13px; font-weight: 800; color: #FDEC06\"\u003e{{ accessLabel }}\u003c/span\u003e\n        \u003c/div\u003e\n        \u003cdiv style=\"display: flex; gap: 10px\"\u003e\n          \u003ca href=\"CoachHome.dc.html\" class=\"glass\" style=\"flex: 1; height: 50px; box-sizing: border-box; border-radius: 16px; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px\"\u003eDashboard\u003c/a\u003e\n          \u003ca href=\"DietPlans.dc.html\" class=\"cta\" style=\"flex: 1; height: 50px; border-radius: 16px; color: #000000; text-decoration: none; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px\"\u003eSee it live\u003c/a\u003e\n        \u003c/div\u003e\n      \u003c/section\u003e\n    \u003c/div\u003e\n  \u003c/sc-if\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":1420}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { name: \u0027Strength Fuel 6W\u0027, goal: \u0027muscle\u0027, weeks: 6, kcal: \u00272,400\u0027, diet: \u0027nonveg\u0027, access: \u0027pro\u0027, listed: true, published: false };\n  }\n  renderVals() {\n    const s = this.state;\n    const tone = (on) =\u003e ({ cls: on ? \u0027cta\u0027 : \u0027glass\u0027, fg: on ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027 });\n    const goals = [[\u0027fat\u0027, \u0027Fat loss\u0027], [\u0027muscle\u0027, \u0027Muscle gain\u0027], [\u0027maintain\u0027, \u0027Maintenance\u0027], [\u0027recomp\u0027, \u0027Recomp\u0027], [\u0027pcos\u0027, \u0027PCOS\u0027]]\n      .map(([id, label]) =\u003e ({ label, pressed: s.goal === id, ...tone(s.goal === id), pick: () =\u003e this.setState({ goal: id }) }));\n    const diets = [[\u0027veg\u0027, \u0027Veg\u0027], [\u0027nonveg\u0027, \u0027Non-veg\u0027], [\u0027vegan\u0027, \u0027Vegan\u0027], [\u0027egg\u0027, \u0027Egg\u0027]]\n      .map(([id, label]) =\u003e ({ label, pressed: s.diet === id, ...tone(s.diet === id), pick: () =\u003e this.setState({ diet: id }) }));\n    const accessDefs = {\n      all: { label: \u0027All members\u0027, hint: \u0027Open to Lean Start, Pro \u0026 Elite\u0027, who: \u0027All Leanr members\u0027, invite: \u0027on any membership\u0027 },\n      pro: { label: \u0027Pro \u0026 Elite\u0027, hint: \u0027Open to Lean Pro \u0026 Lean Elite\u0027, who: \u0027Lean Pro and Lean Elite members\u0027, invite: \u0027on Lean Pro or Lean Elite\u0027 },\n      elite: { label: \u0027Elite only\u0027, hint: \u0027Open to Lean Elite only\u0027, who: \u0027Lean Elite members\u0027, invite: \u0027on Lean Elite\u0027 }\n    };\n    const access = [\u0027all\u0027, \u0027pro\u0027, \u0027elite\u0027]\n      .map((id) =\u003e ({ label: accessDefs[id].label, pressed: s.access === id, ...tone(s.access === id), pick: () =\u003e this.setState({ access: id }) }));\n    const acc = accessDefs[s.access] || accessDefs.pro;\n    const meals = [\n      { slot: \u0027Breakfast\u0027, time: \u00278:00 AM\u0027, name: \u0027Egg bhurji \u0026 multigrain toast\u0027, kcal: \u0027450\u0027 },\n      { slot: \u0027Lunch\u0027, time: \u00271:30 PM\u0027, name: \u0027Chicken rice bowl, dal \u0026 salad\u0027, kcal: \u0027720\u0027 },\n      { slot: \u0027Pre-workout\u0027, time: \u00275:00 PM\u0027, name: \u0027Banana \u0026 whey shake\u0027, kcal: \u0027330\u0027 },\n      { slot: \u0027Dinner\u0027, time: \u00279:00 PM\u0027, name: \u0027Paneer tikka, quinoa \u0026 greens\u0027, kcal: \u0027650\u0027 }\n    ].map((m) =\u003e ({ ...m, editLabel: \u0027Edit \u0027 + m.slot.toLowerCase() }));\n    const planned = 2150;\n    const target = parseInt(String(s.kcal).replace(/[^0-9]/g, \u0027\u0027), 10) || 0;\n    const pct = target \u003e 0 ? Math.min(100, Math.round((planned / target) * 100)) : 0;\n    const planName = s.name || \u0027Your plan\u0027;\n    return {\n      name: s.name,\n      onName: (e) =\u003e this.setState({ name: e.target.value }),\n      kcal: s.kcal,\n      onKcal: (e) =\u003e this.setState({ kcal: e.target.value }),\n      goals, diets, access, meals,\n      accessHint: acc.hint,\n      accessLabel: acc.label,\n      weeksLabel: s.weeks + (s.weeks === 1 ? \u0027 week\u0027 : \u0027 weeks\u0027),\n      fewer: () =\u003e this.setState({ weeks: Math.max(1, s.weeks - 1) }),\n      more: () =\u003e this.setState({ weeks: Math.min(24, s.weeks + 1) }),\n      plannedLabel: \u00272,150 of \u0027 + (s.kcal || \u00270\u0027) + \u0027 kcal\u0027,\n      plannedPct: pct + \u0027%\u0027,\n      listed: s.listed,\n      toggleListed: () =\u003e this.setState({ listed: !s.listed }),\n      switchBg: s.listed ? \u0027#FDEC06\u0027 : \u0027rgba(255, 255, 255, 0.22)\u0027,\n      knobBg: s.listed ? \u0027#000000\u0027 : \u0027#FFFFFF\u0027,\n      knobLeft: s.listed ? \u002724px\u0027 : \u00274px\u0027,\n      published: s.published,\n      publish: () =\u003e this.setState({ published: true }),\n      liveNote: s.listed\n        ? planName + \u0027 is now listed in Diet plans. \u0027 + acc.who + \u0027 can unlock it with their membership and start today.\u0027\n        : planName + \u0027 is live for the clients you invite \u0027 + acc.invite + \u0027.\u0027\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n","Trainers":"\u003c!doctype html\u003e\n\u003chtml lang=\"en\"\u003e\n\u003chead\u003e\n\u003cmeta charset=\"utf-8\"\u003e\n\u003ctitle\u003eLeanr — Find a trainer\u003c/title\u003e\n\u003cscript src=\"./support.js\"\u003e\u003c/script\u003e\n\u003c/head ground: #FDEC06; opacity: 0.18\"\u003e\u003c/div\u003e\n\n  \u003cmain style=\"position: relative; padding: 52px 20px 110px; display: flex; flex-direction: column; gap: 16px\"\u003e\n\n    \u003cheader style=\"display: flex; align-items: center; gap: 12px\"\u003e\n      \u003ca href=\"Home.dc.html\" class=\"glass\" aria-label=\"Back to home\" style=\"width: 44px; height: 44px; border-radius: 999px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex: none\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\"\u003e\u003cpath d=\"m15 5-7 7 7 7\"/\u003e\u003c/svg\u003e\n      \u003c/a\u003e\n      \u003cdiv style=\"display: flex; flex-direction: column; gap: 4px\"\u003e\n        \u003ch1 style=\"margin: 0; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; font-weight: 700; font-size: 32px; line-height: 1; text-transform: uppercase\"\u003eBook a PT\u003c/h1\u003e\n        \u003cspan style=\"font-size: 14px; color: rgba(255, 255, 255, 0.72)\"\u003ePick a coach, then grab a slot.\u003c/span\u003e\n      \u003c/div\u003e\n    \u003c/header\u003e\n\n    \u003cdiv role=\"group\" aria-label=\"Session type\" class=\"glass\" style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 14px\"\u003e\n      \u003csc-for list=\"{{ modes }}\" as=\"mode\" hint-placeholder-count=\"2\"\u003e\n        \u003cbutton class=\"{{ mode.cls }}\" aria-pressed=\"{{ mode.pressed }}\" onClick=\"{{ mode.pick }}\" style=\"height: 44px; border-radius: 10px; padding: 0; color: {{ mode.fg }}; font-family: \u0027Manrope\u0027, sans-serif; font-weight: 800; font-size: 14px; cursor: pointer\"\u003e{{ mode.label }}\u003c/button\u003e\n      \u003c/sc-for\u003e\n    \u003c/div\u003e\n\n    \u003cdiv role=\"group\" aria-label=\"Filter by specialty\" style=\"display: flex; gap: 8px; overflow-x: auto; margin: -2px -20px -10px; padding: 2px 20px 10px; scrollbar-width: none\"\u003e\n      \u003csc-for list=\"{{ chips }}\" as=\"chip\" hint-placeholder-count=\"5\"\u003e\n        \u003cbutton class=\"{{ chip.cls }}\" aria-pressed=\"{{ chip.pressed }}\" onClick=\"{{ chip.pick }}\" style=\"flex: none; height: 38px; padding: 0 16px; border-radius: 999px; color: {{ chip.fg }}; font-family: \u0027Manrope\u0027, sans-serif; font-weight: {{ chip.weight }}; font-size: 14px; cursor: pointer; white-space: nowrap\"\u003e{{ chip.label }}\u003c/button\u003e\n      \u003c/sc-for\u003e\n    \u003c/div\u003e\n\n    \u003cdiv style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\"\u003e\n      \u003ch2 style=\"margin: 0; font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: rgba(255, 255, 255, 0.72)\"\u003e{{ countLabel }}\u003c/h2\u003e\n      \u003cspan class=\"glass-y\" style=\"display: flex; align-items: center; gap: 5px; flex: none; font-size: 11px; font-weight: 800; padding: 4px 10px 4px 8px; border-radius: 999px; color: #FDEC06\"\u003e\n        \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 13px; height: 13px\"\u003e\u003cpath d=\"M12 3.5 14 10l6.5 2-6.5 2-2 6.5-2-6.5-6.5-2L10 10Z\"/\u003e\u003c/svg\u003ePro · 10% off PT\u003c/span\u003e\n    \u003c/div\u003e\n\n    \u003cdiv style=\"display: flex; flex-direction: column; gap: 10px\"\u003e\n      \u003csc-for list=\"{{ trainers }}\" as=\"t\" hint-placeholder-count=\"3\"\u003e\n        \u003carticle class=\"glass\" style=\"border-radius: 22px; padding: 14px; display: flex; flex-direction: column; gap: 12px\"\u003e\n          \u003cdiv style=\"display: flex; align-items: center; gap: 12px\"\u003e\n            \u003cdiv aria-hidden=\"true\" class=\"{{ t.avCls }}\" style=\"width: 56px; height: 56px; box-sizing: border-box; flex: none; border-radius: 16px; color: {{ t.avFg }}; display: flex; align-items: center; justify-content: center; font-family: \u0027Chakra Petch\u0027, sans-serif; font-style: italic; fon ass\" aria-label=\"{{ k.aria }}\" onClick=\"{{ k.press }}\" style=\"height: 58px; border-radius: 18px; color: #FFFFFF; font-family: \u0027Chakra Petch\u0027, sans-serif; font-weight: 700; font-size: 24px; cursor: pointer\"\u003e{{ k.label }}\u003c/button\u003e\n        \u003c/sc-if\u003e\n        \u003csc-if value=\"{{ k.isBack }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n          \u003cbutton aria-label=\"Delete last digit\" onClick=\"{{ k.press }}\" style=\"height: 58px; border-radius: 18px; border: 0; background: transparent; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer\"\u003e\n            \u003csvg class=\"ic\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" style=\"width: 26px; height: 26px\"\u003e\u003cpath d=\"M9 5h11v14H9l-6-7Z\"/\u003e\u003cpath d=\"m12.5 9.5 5 5M17.5 9.5l-5 5\"/\u003e\u003c/svg\u003e\n          \u003c/button\u003e\n        \u003c/sc-if\u003e\n        \u003csc-if value=\"{{ k.isBlank }}\" hint-placeholder-val=\"{{ false }}\"\u003e\n          \u003cdiv aria-hidden=\"true\" style=\"height: 58px\"\u003e\u003c/div\u003e\n        \u003c/sc-if\u003e\n      \u003c/sc-for\u003e\n    \u003c/div\u003e\n  \u003c/main\u003e\n\u003c/div\u003e\n\u003c/x-dc\u003e\n\u003cscript type=\"text/x-dc\" data-dc-script data-props=\u0027{\"$preview\":{\"width\":390,\"height\":844}}\u0027\u003e\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { code: \u0027482\u0027, secs: 24 };\n  }\n  componentDidMount() {\n    this.timer = setInterval(() =\u003e {\n      if (this.state.secs \u003e 0) this.setState({ secs: this.state.secs - 1 });\n    }, 1000);\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer);\n  }\n  renderVals() {\n    const s = this.state;\n    const code = s.code;\n    const boxes = [0, 1, 2, 3, 4, 5].map((i) =\u003e {\n      const filled = i \u003c code.length;\n      const active = i === code.length;\n      return {\n        d: filled ? code[i] : \u0027\u0027,\n        caret: active,\n        cls: filled || active ? \u0027glass-y\u0027 : \u0027glass\u0027,\n        border: active ? \u0027#FDEC06\u0027 : (filled ? \u0027rgba(253, 236, 6, 0.42)\u0027 : \u0027rgba(255, 255, 255, 0.14)\u0027)\n      };\n    });\n    const layout = [\u00271\u0027, \u00272\u0027, \u00273\u0027, \u00274\u0027, \u00275\u0027, \u00276\u0027, \u00277\u0027, \u00278\u0027, \u00279\u0027, \u0027\u0027, \u00270\u0027, \u0027back\u0027];\n    const keys = layout.map((k) =\u003e ({\n      label: k,\n      aria: \u0027Digit \u0027 + k,\n      isDigit: k !== \u0027\u0027 \u0026\u0026 k !== \u0027back\u0027,\n      isBack: k === \u0027back\u0027,\n      isBlank: k === \u0027\u0027,\n      press: () =\u003e {\n        if (k === \u0027back\u0027) this.setState({ code: this.state.code.slice(0, -1) });\n        else if (k !== \u0027\u0027 \u0026\u0026 this.state.code.length \u003c 6) this.setState({ code: this.state.code + k });\n      }\n    }));\n    const complete = code.length === 6;\n    return {\n      boxes,\n      keys,\n      complete,\n      incomplete: !complete,\n      srStatus: code.length + \u0027 of 6 digits entered\u0027,\n      waiting: s.secs \u003e 0,\n      canResend: s.secs === 0,\n      timer: \u00270:\u0027 + (s.secs \u003c 10 ? \u00270\u0027 : \u0027\u0027) + s.secs,\n      resend: () =\u003e this.setState({ secs: 30, code: \u0027\u0027 })\n    };\n  }\n}\n\u003c/script\u003e\n\u003c/body\u003e\n\u003c/html\u003e\n"};
